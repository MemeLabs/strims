name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    # rust-toolchain.toml names the channel, components and wasm target.
    - name: Install toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - name: Format
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --features strims-node/turmoil -- -D warnings
    - name: Test
      run: cargo test --workspace
    - name: Check wasm
      run: cargo check --workspace --exclude strims-node --exclude strims-sim --exclude strims-kv-redb --exclude strims-testworld --exclude strims-svc --target wasm32-unknown-unknown
    - name: Clippy wasm
      run: cargo clippy -p strims-node-core -p strims-wasm --target wasm32-unknown-unknown --all-targets --features strims-wasm/e2e -- -D warnings

  go:
    name: Go (infra)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Test
      run: go test `go list ./... | grep -v internal/models`
