# hack/simlab and the scripts over it (hack/sim-db, hack/sim-suite,
# hack/capture, hack/console): the venv they run in, hack/.venv, which
# `uv run --project hack --locked` makes and each script's bootstrap
# (simlab/bootstrap.py) runs it under.

[project]
name = "simlab"
version = "0"
requires-python = ">=3.14,<3.15"
dependencies = ["anthropic==2.8.0", "duckdb==1.5.6", "jinja2==3.1.6", "pydantic==2.14.3", "pytz==2026.6"]

[tool.uv]
package = false
python-preference = "only-system"
