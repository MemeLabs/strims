# The timer bench's control (testbed-timers.toml's thin star, idle): every
# node of one kind with its timer log off and on, and SPEC=1 on both, so
# the viewers' lag, the seed's drops and its allocation steps, beside the
# seed's line timer and writes (read through Date.now(), the clock under
# test), show whether the log, and a browser's page served cross-origin
# isolated with it, leave the node as it was.

kind = "testbed"
repeats = 3
host_cores = 4
paired = false

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables", "cargo build --release --locked -p strims-testbed --example testbed_browser", "export PATH=$HOME/.nvm/versions/node/v26.11.1/bin:$PATH && pnpm install --frozen-lockfile --offline && pnpm exec webpack --mode production --env TARGET=wasm-testbed"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"
BROWSER_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_browser"
WEB_BUNDLE = "dist/wasm-testbed"

[arms]
main = "main"

[env]
VIEWERS = "3"
SEED_UP_MBIT = "10"
SECS = "40"
NODE_ARGS = "--chunk 4096 --munro 32768"
BROWSER_LINKS = "webrtc"
BROWSER_ARGS = "--chunk 4096 --munro 32768"
SPEC = "1"

[axes]
KINDS = ["", "chromium chromium chromium chromium", "firefox firefox firefox firefox"]
TIMER_LOG = ["", "all"]
