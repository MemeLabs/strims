# An adaptive seed's budget at one copy at least (floor, copy-floor)
# against main, on testbed swarms of 5 to 25 native viewers linked as the
# ppspp sim's wide-area meshes (topologies/mesh6-v*): the seed's uplink
# halved 60 s in and back at 180 s, viewers dialing in 30 s after the
# start, as in testbed-headroom. main is 53ca21bc, whose node main still
# runs. Each instance runs one repeat of both arms.

kind = "testbed"
repeats = 6
host_cores = 32

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"

[files]
TOPOLOGY = "topologies/mesh6-v${VIEWERS}"

[arms]
main = "53ca21bc"
floor = "e7dd1e40"

[env]
SECS = "240"
SEED_UP_STEPS = "60:5 180:10"
JOIN_AT = "30"

[axes]
VIEWERS = ["5", "10", "25"]

[report]
group = ["VIEWERS"]
