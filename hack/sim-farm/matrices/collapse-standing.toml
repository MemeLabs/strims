# strims-sim's adaptive-seed WAN cases at the swarm defaults (4 KiB
# chunks, 32 KiB munros) in the window model, streaming 120 s, each run's
# seconds in its row: where the standing cases collapse, beside the
# testbed twin's map (collapse-map.toml). Read it with
# `hack/capture/analyze.py map target/sim-farm/collapse-standing`.

package = "strims-sim"
target = "scenarios"
test = [
  "wan_residential_seed_adaptive",
  "wan_super_peer_adaptive",
  "wan_residential_seed_adaptive_uncapped",
  "wan_super_peer_adaptive_uncapped",
  "wan_global_audience_adaptive_uncapped",
  "wan_mobile_viewers_adaptive_uncapped",
  "wan_residential_two_streams_adaptive_uncapped",
  "wan_slow_viewer_adaptive_uncapped",
  "wan_residential_seed_adaptive_uncapped_varying",
  "wan_super_peer_adaptive_uncapped_varying",
  "wan_residential_seed_adaptive_uncapped_step",
]
slot_mem_gib = 2

[arms]
main = "565028e5"

[env]
STRIMS_SIM_JOB = "1"
STRIMS_SIM_TCP = "1"
STRIMS_SIM_SERIES = "1"
STRIMS_SIM_STREAM_SECS = "120"
STRIMS_SIM_CHUNK = "4096"
STRIMS_SIM_MUNRO = "32768"

[axes]
STRIMS_SIM_SEED = ["1", "2", "3", "4", "5", "6", "7", "8"]

[canary]
STRIMS_SIM_STREAM_SECS = "5"

[report]
columns = [
  "passed:mean",
  "delivery:mean,min",
  "lag_p50_ms:median",
  "lag_p99_ms:median,max",
  "steady_p99_ms:median,max",
]
