# The testbed tier's mesh6-15-5 (native): 15 viewers in a 6-link mesh, a 5 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

# Not yet: run.sh writes STAMPS=date, so every run keys apart (TESTBED_STAMPS) and has no
# twin until run.sh stamps from its clock (STAMPS=clock). Don't run it on the farm before then.

kind = "testbed"
repeats = 2
host_cores = 4
cell = "mesh6-15-5"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/mesh6-v15"

[arms]
main = "main"

[env]
VIEWERS = "15"
SEED_UP_MBIT = "5"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0.1 2:1.0 3:1.9 4:2.1 5:2.8 6:3.1 7:5.6 8:6.8 9:9.0 10:11.7 11:12.5 12:14.2 13:17.8 14:18.9 15:19.5", "1:1.8 2:4.1 3:4.6 4:4.6 5:4.9 6:5.6 7:5.9 8:6.0 9:9.3 10:10.4 11:11.1 12:16.2 13:17.2 14:17.3 15:18.6"]
