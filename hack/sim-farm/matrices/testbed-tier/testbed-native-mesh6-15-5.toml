# The testbed tier's mesh6-15-5 (native): 15 viewers in a 6-link mesh, a 5 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 4
cell = "mesh6-15-5"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/mesh6-v15"

[arms]
main = "main"

[env]
VIEWERS = "15"
SEED_UP_MBIT = "5"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0 2:1 3:1 4:2 5:2 6:3 7:5 8:6 9:9 10:11 11:12 12:14 13:17 14:18 15:19", "1:1 2:4 3:4 4:4 5:4 6:5 7:5 8:6 9:9 10:10 11:11 12:16 13:17 14:17 15:18"]
