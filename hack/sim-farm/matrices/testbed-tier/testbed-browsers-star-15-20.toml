# The testbed tier's star-15-20 (browsers): 15 viewers, a 20 Mbit/s seed, as browsers, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

# Not yet: run.sh writes STAMPS=date, so every run keys apart (TESTBED_STAMPS) and has no
# twin until run.sh stamps from its clock (STAMPS=clock). Don't run it on the farm before then.

kind = "testbed"
repeats = 2
host_cores = 16
cell = "star-15-20"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables", "cargo build --release --locked -p strims-testbed --example testbed_browser", "export PATH=$HOME/.nvm/versions/node/v26.11.1/bin:$PATH && pnpm install --frozen-lockfile --offline && pnpm exec webpack --mode production --env TARGET=wasm-testbed"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"
BROWSER_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_browser"
WEB_BUNDLE = "dist/wasm-testbed"

[files]
TOPOLOGY = "../topologies/full-v15"

[arms]
main = "main"

[env]
VIEWERS = "15"
SEED_UP_MBIT = "20"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"
KINDS = "chromium chromium chromium firefox chromium chromium chromium firefox chromium chromium chromium firefox chromium chromium chromium firefox"
BROWSER_LINKS = "webrtc"
BROWSER_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0.6 2:3.3 3:4.2 4:6.3 5:9.0 6:9.1 7:10.0 8:10.6 9:12.2 10:14.2 11:16.6 12:16.7 13:18.5 14:18.6 15:19.4", "1:0.0 2:0.6 3:1.1 4:2.2 5:3.2 6:4.2 7:5.0 8:6.8 9:7.1 10:7.4 11:9.1 12:10.8 13:13.5 14:14.4 15:15.2"]
