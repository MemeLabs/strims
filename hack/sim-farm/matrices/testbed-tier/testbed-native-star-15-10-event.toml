# The testbed tier's star-15-10-event (native): 15 viewers, a 10 Mbit/s seed: a scheduled event's burst into a warm fifth, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 4
cell = "star-15-10-event"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v15"

[arms]
main = "main"

[env]
VIEWERS = "15"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "event:20:20:10"

[repeat_env]
JOINS = ["1:0 2:5 3:16 4:21 5:22 6:23 7:24 8:24 9:24 10:26 11:27 12:27 13:27 14:28 15:29", "1:3 2:5 3:7 4:20 5:20 6:22 7:23 8:25 9:25 10:26 11:26 12:26 13:27 14:27 15:28"]
