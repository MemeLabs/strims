# The testbed tier's star-7-10 (native): 7 viewers, a 10 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

# Not yet: run.sh writes STAMPS=date, so every run keys apart (TESTBED_STAMPS) and has no
# twin until run.sh stamps from its clock (STAMPS=clock). Don't run it on the farm before then.

kind = "testbed"
repeats = 2
host_cores = 4
cell = "star-7-10"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v7"

[arms]
main = "main"

[env]
VIEWERS = "7"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:5.7 2:11.3 3:12.1 4:13.7 5:14.8 6:18.6 7:19.9", "1:0.2 2:8.1 3:11.2 4:12.6 5:17.0 6:17.2 7:18.8"]
