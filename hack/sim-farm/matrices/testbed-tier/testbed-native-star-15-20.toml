# The testbed tier's star-15-20 (native): 15 viewers, a 20 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 4
cell = "star-15-20"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v15"

[arms]
main = "main"

[env]
VIEWERS = "15"
SEED_UP_MBIT = "20"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:1 2:2 3:3 4:3 5:3 6:5 7:6 8:8 9:11 10:12 11:12 12:14 13:17 14:17 15:17", "1:1 2:3 3:4 4:4 5:6 6:9 7:9 8:10 9:14 10:14 11:14 12:15 13:16 14:16 15:19"]
