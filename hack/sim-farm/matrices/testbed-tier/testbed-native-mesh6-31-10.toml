# The testbed tier's mesh6-31-10 (native): 31 viewers in a 6-link mesh, a 10 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "mesh6-31-10"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/mesh6-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:2.4 2:3.1 3:3.8 4:4.0 5:4.2 6:4.3 7:4.4 8:5.2 9:7.7 10:7.9 11:8.3 12:9.0 13:9.3 14:10.3 15:11.0 16:11.1 17:11.2 18:11.4 19:11.7 20:12.1 21:12.7 22:12.7 23:12.9 24:13.0 25:13.3 26:13.8 27:14.9 28:15.7 29:18.9 30:19.5 31:20.0", "1:0.2 2:1.3 3:1.6 4:1.9 5:2.7 6:3.3 7:4.1 8:4.5 9:5.1 10:6.1 11:7.2 12:8.6 13:8.6 14:8.7 15:9.4 16:10.1 17:10.6 18:11.0 19:11.2 20:11.7 21:12.5 22:12.7 23:12.9 24:13.7 25:14.2 26:14.3 27:15.2 28:16.0 29:16.5 30:17.7 31:19.9"]
