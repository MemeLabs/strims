# The testbed tier's mesh6-31-10 (native): 31 viewers in a 6-link mesh, a 10 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "mesh6-31-10"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/mesh6-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:2.443 2:3.078 3:3.760 4:4.037 5:4.172 6:4.342 7:4.439 8:5.176 9:7.747 10:7.938 11:8.263 12:8.955 13:9.292 14:10.273 15:11.037 16:11.102 17:11.240 18:11.393 19:11.748 20:12.077 21:12.731 22:12.740 23:12.878 24:13.041 25:13.294 26:13.818 27:14.895 28:15.743 29:18.928 30:19.513 31:19.969", "1:0.207 2:1.299 3:1.616 4:1.934 5:2.675 6:3.342 7:4.080 8:4.479 9:5.101 10:6.051 11:7.242 12:8.583 13:8.583 14:8.691 15:9.437 16:10.083 17:10.573 18:10.983 19:11.167 20:11.662 21:12.483 22:12.746 23:12.914 24:13.715 25:14.175 26:14.336 27:15.211 28:15.978 29:16.467 30:17.654 31:19.858"]
