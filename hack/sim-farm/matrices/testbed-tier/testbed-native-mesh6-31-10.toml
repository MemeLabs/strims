# The testbed tier's mesh6-31-10 (native): 31 viewers in a 6-link mesh, a 10 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "mesh6-31-10"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/mesh6-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:2 2:3 3:3 4:4 5:4 6:4 7:4 8:5 9:7 10:7 11:8 12:8 13:9 14:10 15:11 16:11 17:11 18:11 19:11 20:12 21:12 22:12 23:12 24:13 25:13 26:13 27:14 28:15 29:18 30:19 31:19", "1:0 2:1 3:1 4:1 5:2 6:3 7:4 8:4 9:5 10:6 11:7 12:8 13:8 14:8 15:9 16:10 17:10 18:10 19:11 20:11 21:12 22:12 23:12 24:13 25:14 26:14 27:15 28:15 29:16 30:17 31:19"]
