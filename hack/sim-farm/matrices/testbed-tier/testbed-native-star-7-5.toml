# The testbed tier's star-7-5 (native): 7 viewers, a 5 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 4
cell = "star-7-5"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v7"

[arms]
main = "main"

[env]
VIEWERS = "7"
SEED_UP_MBIT = "5"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:2.054 2:5.401 3:5.426 4:13.552 5:16.175 6:16.323 7:16.672", "1:3.615 2:6.427 3:7.314 4:10.221 5:13.990 6:15.002 7:17.053"]
