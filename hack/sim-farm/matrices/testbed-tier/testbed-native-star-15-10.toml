# The testbed tier's star-15-10 (native): 15 viewers, a 10 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 4
cell = "star-15-10"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v15"

[arms]
main = "main"

[env]
VIEWERS = "15"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:2.4 2:2.7 3:4.0 4:4.0 5:5.1 6:6.2 7:6.2 8:6.6 9:6.7 10:7.9 11:9.1 12:12.5 13:13.9 14:16.8 15:17.2", "1:2.0 2:2.4 3:3.1 4:4.6 5:7.6 6:8.2 7:9.2 8:9.2 9:11.7 10:12.2 11:12.5 12:14.0 13:14.1 14:18.3 15:19.4"]
