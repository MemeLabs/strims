# The testbed tier's star-31-20 (native): 31 viewers, a 20 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "star-31-20"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "20"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0.6 2:0.6 3:1.9 4:2.4 5:3.3 6:4.5 7:5.1 8:6.5 9:6.7 10:7.2 11:7.3 12:7.3 13:8.6 14:9.3 15:9.3 16:10.0 17:10.1 18:12.5 19:12.6 20:14.5 21:16.2 22:16.2 23:16.3 24:17.6 25:18.6 26:18.7 27:19.0 28:19.1 29:19.2 30:19.6 31:19.9", "1:0.3 2:0.5 3:0.9 4:2.0 5:4.9 6:5.0 7:5.0 8:5.7 9:5.7 10:5.8 11:7.6 12:8.9 13:9.2 14:10.3 15:10.4 16:10.5 17:11.0 18:11.2 19:11.9 20:11.9 21:12.8 22:13.4 23:13.8 24:14.4 25:15.1 26:15.3 27:15.4 28:17.6 29:17.7 30:18.4 31:19.7"]
