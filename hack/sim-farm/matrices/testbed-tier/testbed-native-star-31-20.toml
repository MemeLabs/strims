# The testbed tier's star-31-20 (native): 31 viewers, a 20 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "star-31-20"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "20"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0.5 2:0.6 3:1.9 4:2.3 5:3.2 6:4.5 7:5.1 8:6.4 9:6.6 10:7.2 11:7.3 12:7.3 13:8.6 14:9.2 15:9.3 16:9.9 17:10.0 18:12.4 19:12.6 20:14.5 21:16.1 22:16.2 23:16.2 24:17.5 25:18.6 26:18.6 27:18.9 28:19.0 29:19.1 30:19.6 31:19.8", "1:0.2 2:0.4 3:0.9 4:1.9 5:4.8 6:4.9 7:5.0 8:5.6 9:5.6 10:5.7 11:7.6 12:8.9 13:9.2 14:10.2 15:10.3 16:10.5 17:10.9 18:11.2 19:11.9 20:11.9 21:12.7 22:13.4 23:13.8 24:14.3 25:15.1 26:15.2 27:15.4 28:17.5 29:17.6 30:18.4 31:19.6"]
