# The testbed tier's star-31-20 (native): 31 viewers, a 20 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "star-31-20"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "20"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0.561 2:0.612 3:1.940 4:2.392 5:3.278 6:4.500 7:5.107 8:6.462 9:6.680 10:7.209 11:7.307 12:7.342 13:8.613 14:9.250 15:9.327 16:9.990 17:10.061 18:12.473 19:12.639 20:14.532 21:16.181 22:16.235 23:16.284 24:17.577 25:18.636 26:18.670 27:18.964 28:19.075 29:19.151 30:19.647 31:19.876", "1:0.289 2:0.483 3:0.927 4:1.989 5:4.872 6:4.957 7:5.041 8:5.666 9:5.683 10:5.789 11:7.633 12:8.940 13:9.208 14:10.269 15:10.380 16:10.522 17:10.983 18:11.237 19:11.916 20:11.949 21:12.786 22:13.424 23:13.831 24:14.380 25:15.128 26:15.278 27:15.407 28:17.588 29:17.690 30:18.441 31:19.680"]
