# The testbed tier's star-31-20 (native): 31 viewers, a 20 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "star-31-20"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "20"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0 2:0 3:1 4:2 5:3 6:4 7:5 8:6 9:6 10:7 11:7 12:7 13:8 14:9 15:9 16:9 17:10 18:12 19:12 20:14 21:16 22:16 23:16 24:17 25:18 26:18 27:18 28:19 29:19 30:19 31:19", "1:0 2:0 3:0 4:1 5:4 6:4 7:5 8:5 9:5 10:5 11:7 12:8 13:9 14:10 15:10 16:10 17:10 18:11 19:11 20:11 21:12 22:13 23:13 24:14 25:15 26:15 27:15 28:17 29:17 30:18 31:19"]
