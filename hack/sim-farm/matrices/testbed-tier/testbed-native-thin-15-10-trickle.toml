# The testbed tier's thin-15-10-trickle (native): 15 viewers with 3 Mbit/s uplinks, a 10 Mbit/s seed, trickling in, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 4
cell = "thin-15-10-trickle"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v15"

[arms]
main = "main"

[env]
VIEWERS = "15"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
VIEWER_UP_MBIT = "3"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:1 2:2 3:3 4:5 5:9 6:9 7:12 8:14 9:15 10:15 11:16 12:16 13:17 14:18 15:18", "1:4 2:7 3:8 4:9 5:9 6:12 7:12 8:13 9:13 10:14 11:15 12:15 13:15 14:17 15:19"]
