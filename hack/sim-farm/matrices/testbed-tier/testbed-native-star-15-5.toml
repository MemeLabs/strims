# The testbed tier's star-15-5 (native): 15 viewers, a 5 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 4
cell = "star-15-5"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v15"

[arms]
main = "main"

[env]
VIEWERS = "15"
SEED_UP_MBIT = "5"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:1 2:3 3:3 4:3 5:4 6:12 7:13 8:14 9:15 10:17 11:18 12:18 13:18 14:19 15:19", "1:1 2:1 3:2 4:2 5:4 6:4 7:5 8:5 9:5 10:9 11:9 12:9 13:14 14:15 15:17"]
