# The testbed tier's star-31-10 (native): 31 viewers, a 10 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "star-31-10"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0.769 2:1.246 3:1.803 4:1.924 5:3.001 6:3.247 7:3.504 8:3.702 9:4.270 10:4.378 11:5.209 12:7.207 13:7.463 14:8.772 15:9.282 16:9.597 17:9.607 18:10.453 19:11.170 20:11.442 21:12.007 22:12.213 23:12.417 24:12.614 25:13.783 26:15.799 27:17.628 28:18.687 29:18.798 30:19.790 31:19.828", "1:1.077 2:2.159 3:4.555 4:4.713 5:5.573 6:5.993 7:6.863 8:7.283 9:7.899 10:9.012 11:9.403 12:11.654 13:12.283 14:12.757 15:12.923 16:13.115 17:13.399 18:14.044 19:15.407 20:15.511 21:15.719 22:15.904 23:16.229 24:16.739 25:17.409 26:17.843 27:18.321 28:18.637 29:18.937 30:19.496 31:19.511"]
