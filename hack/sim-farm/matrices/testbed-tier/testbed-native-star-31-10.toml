# The testbed tier's star-31-10 (native): 31 viewers, a 10 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "star-31-10"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0.8 2:1.2 3:1.8 4:1.9 5:3.0 6:3.2 7:3.5 8:3.7 9:4.3 10:4.4 11:5.2 12:7.2 13:7.5 14:8.8 15:9.3 16:9.6 17:9.6 18:10.5 19:11.2 20:11.4 21:12.0 22:12.2 23:12.4 24:12.6 25:13.8 26:15.8 27:17.6 28:18.7 29:18.8 30:19.8 31:19.8", "1:1.1 2:2.2 3:4.6 4:4.7 5:5.6 6:6.0 7:6.9 8:7.3 9:7.9 10:9.0 11:9.4 12:11.7 13:12.3 14:12.8 15:12.9 16:13.1 17:13.4 18:14.0 19:15.4 20:15.5 21:15.7 22:15.9 23:16.2 24:16.7 25:17.4 26:17.8 27:18.3 28:18.6 29:18.9 30:19.5 31:19.5"]
