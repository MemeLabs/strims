# The testbed tier's star-31-10 (native): 31 viewers, a 10 Mbit/s seed, honest, against its twin
# (simlab.testbed.tier_matrices writes it).

kind = "testbed"
repeats = 2
host_cores = 8
cell = "star-31-10"

[build]
commands = ["cargo build --release --locked -p strims-sim --example testbed_node --example testbed_tables"]

[artifacts]
NODE_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_node"
TABLES_BIN = "$CARGO_TARGET_DIR/release/examples/testbed_tables"

[files]
TOPOLOGY = "../topologies/full-v31"

[arms]
main = "main"

[env]
VIEWERS = "31"
SEED_UP_MBIT = "10"
SECS = "60"
PCAP = "1"
NODE_ARGS = "--chunk 4096 --munro 32768"

[knobs]
STRIMS_SIM_ARRIVALS = "trickle"

[repeat_env]
JOINS = ["1:0 2:1 3:1 4:1 5:3 6:3 7:3 8:3 9:4 10:4 11:5 12:7 13:7 14:8 15:9 16:9 17:9 18:10 19:11 20:11 21:12 22:12 23:12 24:12 25:13 26:15 27:17 28:18 29:18 30:19 31:19", "1:1 2:2 3:4 4:4 5:5 6:5 7:6 8:7 9:7 10:9 11:9 12:11 13:12 14:12 15:12 16:13 17:13 18:14 19:15 20:15 21:15 22:15 23:16 24:16 25:17 26:17 27:18 28:18 29:18 30:19 31:19"]
