# The ppspp sim's seed allocation bounds (seed_allocation_bounds): pins of
# what the seed can't know (random viewers, whole copies at random or at
# the nearest viewers, the fastest uplinks first) against the default
# admission, with and without the seed's uplink shares by allocation.
# DcOnly is left out: the table runs it behind WanSuperPeer alone.

package = "strims-ppspp"
target = "sim"
test = "sim_job"
slot_mem_gib = 1.5

[arms]
main = "main"

[axes]
SIM_SCENARIO = ["WanResidentialSeed", "WanSuperPeer"]
SIM_CASE = ["Admission", "AdmissionQos", "Random", "RandomQos", "WholeQos", "NearestQos", "Oracle", "OracleQos"]
SIM_CONTROLLER = ["ledbat", "bbr"]
SIM_SEED = ["1", "2", "3", "4", "5", "6", "7", "8"]

# A pin gets as many slots as the admission spent at the same scenario,
# controller and seed.
[[derive]]
when = { SIM_CASE = ["Random", "RandomQos", "WholeQos", "NearestQos", "Oracle", "OracleQos"] }
from = { SIM_CASE = "Admission" }
set = { SIM_SLOTS = "seed_slots:round" }

[canary]
SIM_SECS = "2"
SIM_WARM = "1"

[report]
columns = [
  "delivery:mean,min",
  "lag_p50_ms:median",
  "lag_p99_ms:median,max",
  "stripe_p99_ms:median,max",
  "seed_share:mean",
  "seed_slots:mean",
  "seed_uplink:mean",
]
