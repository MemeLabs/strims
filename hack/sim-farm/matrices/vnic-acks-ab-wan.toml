# vnic-acks-ab.toml's comparison in strims-sim, real nodes over turmoil
# (STRIMS_SIM_PATH): the adaptive seed's WAN cases, capped, uncapped,
# varying and stepped, under the window model, and the request controllers'
# cases (a latency step, a capped seed, a starved one), with series.
# vnic-acks-ab-wan-main.toml has main's twin.

package = "strims-sim"
target = "scenarios"
test = [
  "wan_residential_seed_adaptive",
  "wan_super_peer_adaptive",
  "wan_residential_seed_adaptive_uncapped",
  "wan_super_peer_adaptive_uncapped",
  "wan_global_audience_adaptive_uncapped",
  "wan_mobile_viewers_adaptive_uncapped",
  "wan_residential_two_streams_adaptive_uncapped",
  "wan_slow_viewer_adaptive_uncapped",
  "wan_residential_seed_adaptive_uncapped_varying",
  "wan_super_peer_adaptive_uncapped_varying",
  "wan_residential_seed_adaptive_uncapped_step",
  "latency_step_hybrid",
  "latency_step_hybrid_bbr",
  "capped_seed_hybrid",
  "capped_seed_hybrid_bbr",
  "seed_starved_hybrid",
]
slot_mem_gib = 2

[arms]
vnic-acks = "78fa46fa"

[env]
STRIMS_SIM_JOB = "1"
STRIMS_SIM_TCP = "1"
STRIMS_SIM_SERIES = "1"

[axes]
STRIMS_SIM_PATH = ["", "meter", "holder", "controller", "link"]
STRIMS_SIM_SEED = ["1", "2", "3", "4", "5", "6", "7", "8"]

[canary]
STRIMS_SIM_STREAM_SECS = "5"

[report]
columns = [
  "delivery:mean,min",
  "lag_p50_ms:median",
  "lag_p99_ms:median,max",
  "timeouts:mean",
]
