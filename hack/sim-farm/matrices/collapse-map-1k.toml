# collapse-map.toml at the testbed's chunks (1 KiB, a 64 KiB munro per
# write), where its collapses were first seen: the same axes, so the two
# maps differ only in chunk size. Read it with
# `hack/capture/analyze.py map target/sim-farm/collapse-map-1k`.

package = "strims-sim"
target = "scenarios"
test = "calibration_star"
slot_mem_gib = 1

[arms]
main = "565028e5"

[env]
STRIMS_SIM_JOB = "1"
STRIMS_SIM_TCP = "1"
STRIMS_SIM_CAL_SECS = "240"

[axes]
STRIMS_SIM_CAL_VIEWERS = ["3", "7", "15", "31"]
STRIMS_SIM_CAL_SEED_UP_MBIT = ["5", "10", "20", "40"]
STRIMS_SIM_KNOWN_UPLINK = ["0", "1"]
STRIMS_SIM_CAL_MESH = ["full", "mesh6"]
STRIMS_SIM_CAL_SEED_UP_SCALE = ["", "60:0.5 180:1"]
STRIMS_SIM_SEED = ["1", "2", "3", "4", "5", "6", "7", "8"]

[canary]
STRIMS_SIM_CAL_SECS = "5"

[report]
columns = [
  "delivery:mean,min",
  "lag_p50_ms:median",
  "lag_p99_ms:median,max",
  "push_misses/push_hits:ratio",
  "seed_first_wave:median",
]
