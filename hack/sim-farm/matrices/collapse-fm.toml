# Ablations of the collapse modes: each fm-* arm is a local branch that
# changes one rule (see its commit), never to land, run on the cells of
# collapse-map.toml where the modes appear (full mesh, uplinks unknown,
# 4 KiB chunks) against main. Read it with
# `hack/capture/analyze.py map target/sim-farm/collapse-fm --group arm,...`.

package = "strims-sim"
target = "scenarios"
test = "calibration_star"
slot_mem_gib = 1

[arms]
main = "89eba75b"
fm-answer-bound = "fm-answer-bound"
fm-relay-rate = "fm-relay-rate"
fm-silence = "fm-silence"
fm-no-silent-bar = "fm-no-silent-bar"
fm-cut-early = "fm-cut-early"

[env]
STRIMS_SIM_JOB = "1"
STRIMS_SIM_TCP = "1"
STRIMS_SIM_CAL_SECS = "240"
STRIMS_SIM_CAL_MESH = "full"
STRIMS_SIM_CHUNK = "4096"
STRIMS_SIM_MUNRO = "32768"

[axes]
STRIMS_SIM_CAL_VIEWERS = ["3", "7", "15", "31"]
STRIMS_SIM_CAL_SEED_UP_MBIT = ["5", "10", "20"]
STRIMS_SIM_CAL_SEED_UP_SCALE = ["", "60:0.5 180:1"]
STRIMS_SIM_SEED = ["1", "2", "3", "4", "5", "6", "7", "8"]

[canary]
STRIMS_SIM_CAL_SECS = "5"

[report]
columns = [
  "delivery:mean,min",
  "lag_p50_ms:median",
  "lag_p99_ms:median,max",
]
