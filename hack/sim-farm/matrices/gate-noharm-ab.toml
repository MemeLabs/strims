# The answer gate's do-no-harm cells in the ppspp sim, main's arm:
# vnic-acks-ab.toml's A/B scenarios at the swarm defaults, 120 s.
# gate-noharm-ab-on.toml runs the gate's arm.

package = "strims-ppspp"
target = "sim"
test = "sim_job"
slot_mem_gib = 2

[arms]
main = "4daedef5"

[env]
SIM_CASE = "AdaptiveQos"
SIM_STREAMS = "16"
SIM_CHUNK = "4096"
SIM_MUNRO = "32768"
SIM_SECS = "120"
SIM_SERIES = "1"

[axes]
SIM_SCENARIO = ["LiveMesh", "SparseLossy", "LatencyStep", "CappedSeed", "SeedStarved", "CrossTraffic", "WanGlobal", "WanMobile", "WanResidentialSeed", "WanSuperPeer"]
SIM_SEED = ["1", "2", "3", "4", "5", "6", "7", "8"]

[canary]
SIM_SECS = "2"
SIM_WARM = "1"

[report]
columns = [
  "delivery:mean,min",
  "lag_p50_ms:median",
  "lag_p99_ms:median,max",
  "timeouts:mean",
  "wasted/chunks_read:ratio",
]
