# The answer gate's screen (branch answer-gate), main's arm: the collapse
# cells of collapse-fm.toml (calibration_star, full mesh, uplinks unknown,
# 4 KiB chunks, the window model). gate-collapse-on.toml and
# gate-collapse-ablate.toml run the gate's arms on the same cells. Read
# them with `hack/capture/analyze.py pair` and `map` (--ignore
# STRIMS_SIM_GATE).

package = "strims-sim"
target = "scenarios"
test = "calibration_star"
slot_mem_gib = 1

[arms]
main = "4daedef5"

[env]
STRIMS_SIM_JOB = "1"
STRIMS_SIM_TCP = "1"
STRIMS_SIM_CAL_SECS = "240"
STRIMS_SIM_CAL_MESH = "full"
STRIMS_SIM_CHUNK = "4096"
STRIMS_SIM_MUNRO = "32768"

[axes]
STRIMS_SIM_CAL_VIEWERS = ["3", "7", "15", "31"]
STRIMS_SIM_CAL_SEED_UP_MBIT = ["5", "10", "20"]
STRIMS_SIM_CAL_SEED_UP_SCALE = ["", "60:0.5 180:1"]
STRIMS_SIM_SEED = ["1", "2", "3", "4", "5", "6", "7", "8"]

[canary]
STRIMS_SIM_CAL_SECS = "5"

[report]
columns = [
  "delivery:mean,min",
  "lag_p50_ms:median",
  "lag_p99_ms:median,max",
  "seed_push_wait_p99_ms:median",
  "seed_answer_wait_p99_ms:median",
]
