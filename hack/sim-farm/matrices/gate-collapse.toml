# The answer gate's screen (branch answer-gate), main's arm: the collapse
# cells of collapse-fm.toml (calibration_star, full mesh, uplinks unknown,
# 4 KiB chunks, the window model). Read it in the lake as
# collapse-map.toml says, its jobs' stored_cell 'gate-collapse', and a
# matrix of the gate's arms on the same cells (GATE below) against it
# seed by seed with scoring.sql's effects_of: each side a matrix's jobs
# of its latest commit, in cell and seed order, a cell their test and env
# but the seed and the gate:
#
#   simdb.py lake "WITH side AS (SELECT stored_cell AS m, commit, ran_at,
#     seed, k, src, test || ' ' || array_to_string(list_sort(list_transform(
#       list_filter(map_entries(env), lambda e: e.key NOT IN
#       ('STRIMS_SIM_SEED', 'STRIMS_SIM_GATE')),
#       lambda e: e.key || '=' || e.value)), ' ') AS cell FROM jobs),
#     latest AS (SELECT m, arg_max(commit, ran_at) AS commit FROM side
#       GROUP BY m),
#     a AS (SELECT list({'cell': cell, 'seed': seed, 'k': k, 'src': src}
#       ORDER BY cell, seed) AS s FROM side JOIN latest USING (m, commit)
#       WHERE m = 'gate-collapse'),
#     b AS (SELECT list({'cell': cell, 'seed': seed, 'k': k, 'src': src}
#       ORDER BY cell, seed) AS s FROM side JOIN latest USING (m, commit)
#       WHERE m = 'GATE')
#     SELECT * FROM effects_of((SELECT list(DISTINCT cell) FROM side
#       WHERE m = 'gate-collapse'), (FROM a), (FROM b))"

package = "strims-sim"
target = "scenarios"
test = "calibration_star"
slot_mem_gib = 1

[arms]
main = "4daedef5"

[env]
STRIMS_SIM_JOB = "1"
STRIMS_SIM_TCP = "1"
STRIMS_SIM_CAL_SECS = "240"
STRIMS_SIM_CAL_MESH = "full"
STRIMS_SIM_CHUNK = "4096"
STRIMS_SIM_MUNRO = "32768"

[axes]
STRIMS_SIM_CAL_VIEWERS = ["3", "7", "15", "31"]
STRIMS_SIM_CAL_SEED_UP_MBIT = ["5", "10", "20"]
STRIMS_SIM_CAL_SEED_UP_SCALE = ["", "60:0.5 180:1"]
STRIMS_SIM_SEED = ["1", "2", "3", "4", "5", "6", "7", "8"]

[canary]
STRIMS_SIM_CAL_SECS = "5"

[report]
columns = [
  "delivery:mean,min",
  "lag_p50_ms:median",
  "lag_p99_ms:median,max",
  "seed_push_wait_p99_ms:median",
  "seed_answer_wait_p99_ms:median",
]
