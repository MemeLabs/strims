[package]
name = "strims-node"
description = "The Tokio driver of strims-node-core: the node over TCP, WebSocket and WebRTC, natively or under turmoil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Simulated network and clock for deterministic whole-node tests.
turmoil = ["dep:turmoil"]

[dependencies]
strims-base.workspace = true
strims-node-core.workspace = true
strims-binmap.workspace = true
strims-proto.workspace = true
strims-crypto.workspace = true
strims-kademlia.workspace = true
strims-qos.workspace = true
strims-vnic.workspace = true
strims-vpn.workspace = true
strims-ppspp.workspace = true
strims-webrtc.workspace = true
strims-kv.workspace = true
strims-replication.workspace = true
strims-transfer.workspace = true
strims-network.workspace = true
strims-directory.workspace = true
strims-chat.workspace = true
strims-debug.workspace = true
strims-video.workspace = true
strims-dao.workspace = true
strims-session.workspace = true
strims-rpc.workspace = true
thiserror.workspace = true
tracing.workspace = true
slotmap.workspace = true
bytes.workspace = true
hex.workspace = true
rand_core.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
httparse.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
socket2 = { version = "0.6", features = ["all"] }
getrandom = "0.3"
turmoil = { workspace = true, optional = true }

[dev-dependencies]
prost.workspace = true
# a local TLS server for the HTTPS client tests
rcgen.workspace = true
sha2.workspace = true
# `synth`: the turmoil tests publish a synthetic RTMP stream.
strims-video = { workspace = true, features = ["test-support"] }
strims-proto = { workspace = true, features = ["services"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util", "sync", "test-util"] }

[lints]
workspace = true
