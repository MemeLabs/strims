[package]
name = "strims-node-core"
description = "The runtime-neutral node: vnic, vpn and ppspp composed, its API handle, the loop its drivers run, and the app layer on it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
strims-base.workspace = true
strims-binmap.workspace = true
strims-proto.workspace = true
strims-crypto.workspace = true
strims-kademlia.workspace = true
strims-qos.workspace = true
strims-vnic.workspace = true
strims-vpn.workspace = true
strims-ppspp.workspace = true
strims-webrtc.workspace = true
# `SwarmRead` and `SwarmWrite` for the swarm handles, and the app layer.
strims-transfer.workspace = true
# The app layer (`app`).
strims-kv.workspace = true
strims-dao.workspace = true
strims-rpc.workspace = true
strims-replication.workspace = true
strims-network.workspace = true
strims-directory.workspace = true
strims-chat.workspace = true
strims-video.workspace = true
strims-debug.workspace = true
strims-session.workspace = true
thiserror.workspace = true
tracing.workspace = true
slotmap.workspace = true
rand_core.workspace = true
# Channels and `select!` only: `sync` needs no runtime and compiles for
# wasm32, where the workspace entry's `net` doesn't.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink", "std"] }

[lints]
workspace = true
