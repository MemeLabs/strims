[package]
name = "strims-testbed"
description = "The calibration testbed's node, shared by its native and browser builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
strims-base.workspace = true
strims-crypto.workspace = true
strims-node-core.workspace = true
strims-ppspp.workspace = true
strims-proto.workspace = true
# The media stream: ingest's source, unit writer and signing, and the
# egress reader.
strims-transfer.workspace = true
strims-video.workspace = true
hex.workspace = true
# `select!`, `join!` and channels, which need no runtime and build on wasm32.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

# The native drivers: a server for the browsers' pages, and the harness.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
httparse.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util", "sync"] }
tokio-tungstenite.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures-util = { workspace = true, features = ["sink", "std"] }
serde_json.workspace = true
strims-video = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
