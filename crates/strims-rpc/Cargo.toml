[package]
name = "strims-rpc"
description = "RPC runtime for the generated strims-proto services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
strims-proto = { workspace = true, features = ["services"] }
prost.workspace = true
thiserror.workspace = true
futures-core.workspace = true
futures-sink.workspace = true
futures-util = { workspace = true, features = ["alloc"] }

[dev-dependencies]
hex.workspace = true
proptest.workspace = true
# tests drive connections on a real executor
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
