[package]
name = "strims-svc"
description = "The headless service: runs a profile's node, serves the UI's frontend RPC over WebSocket and HLS over HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
strims-base.workspace = true
strims-dao.workspace = true
strims-kv.workspace = true
strims-kv-redb.workspace = true
strims-node.workspace = true
strims-proto = { workspace = true, features = ["services"] }
strims-rpc.workspace = true
strims-session.workspace = true
strims-video.workspace = true
thiserror.workspace = true
tracing.workspace = true
data-encoding.workspace = true
httparse.workspace = true
rand_core.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
# `signal`: the binary stops on ctrl-c.
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util", "sync", "signal"] }
tokio-tungstenite.workspace = true
getrandom = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }

[dev-dependencies]
strims-crypto.workspace = true
strims-ppspp.workspace = true
# the HLS test publishes a synthetic stream
strims-video = { workspace = true, features = ["test-support"] }
# the ffmpeg test runs ffmpeg and ffprobe
tokio = { workspace = true, features = ["process"] }
prost.workspace = true

[lints]
workspace = true
