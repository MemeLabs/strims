#:schema metrics.schema.json
# The sims' metrics and dimensions: what the suite scores, what the verdict
# derives, the lab's macro metrics, and the dimensions results are cut by,
# each declared once. hack/simlab/semantic.py reads it, suite.py's METRICS,
# GUARDRAILS, SHOWN and HOST_METRICS are made from it, and the catalog's
# metric_catalog and describe take its descriptions. hack/simlab/spec.py
# checks it (test_semantic) and writes its schema, metrics.schema.json.
#
# guardrails: the guarded metrics (score.guard), in the order arm_score
# checks them.
# [[scored]]: a metric the suite scores, in its scorecards' order.
#   name          the metric's name
#   sql           its value: SQL over a job's row r, verdict v and job j;
#                 or share = {num, den} (num over den, none where den is
#                 0), or per_useful = [fields] (the row's fields summed,
#                 per byte of the stream the honest viewers read)
#   better        lower or higher; none for a metric that only describes
#   score         {kind (ratio or diff), tie (the band an effect is a tie
#                 within), guard (how arm_score breaks an arm on it: worse,
#                 lo, hi), shown (a scorecard shows it, ties too), host (a
#                 host's number: marked h, kept out of totals)}
#   unit          its unit
#   description   what it measures; a metric that reads one field takes
#                 that field's (fields.toml's rows, the verdict's) where it
#                 has none
#   note          how it scores, beside its description
#
# [collapsed]: the collapse test, by collapse_test_of.
# [run_metrics.<name>]: verdict.run_metrics' scalars, each run's.
# [lake.<name>]: a metric the lab's macros compute (macro), with the
#   patterns that would restate its definition elsewhere (restated: the
#   restatement lint, test_semantic's).
# [dimensions.<name>]: what results are cut by: its description, its
#   values (a list, vocab:<section> for the vocabulary's names, fields:<param>
#   for fields.toml's params) and the column or macro that gives it.

guardrails = ["delivery", "lag_p99_ms", "lag_p99_ms_weak", "join_p90_ms", "caught_up_p90_ms", "defector_gain"]

