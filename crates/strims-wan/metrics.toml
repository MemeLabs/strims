[[scored]]
name = "defector_gain"
sql = "CASE WHEN r.lag_p99_ms_hostile <> 0 AND r.lag_p99_ms_honest <> 0 THEN r.lag_p99_ms_hostile / r.lag_p99_ms_honest END"
better = "higher"
score = { kind = "ratio", tie = 0.05, guard = "hi" }
description = "The hostile hosts' lag p99 over the honest viewers' (`lag_p99_ms_hostile` over `lag_p99_ms_honest`): under 1, defecting pays."

