[collapsed]
macro = "collapse_test_of"
better = "lower"
kind = "count"
guard = "collapsed"
description = "Collapsed runs of a cell, A against B, judged by their counts' Fisher exact p (suite.py collapses and fisher)."

[run_metrics.collapses]
description = "Collapse spells (`episodes`' collapse kind)."

[run_metrics.flaps_per_min]
unit = "per minute"
description = "Changes between healthy and unhealthy seconds after the run's startup, a minute."

[run_metrics.healthy_dwell_p50_s]
unit = "s"
description = "The median length of the run's healthy spells."

[run_metrics.healthy_dwell_p90_s]
unit = "s"
description = "The p90 length of the run's healthy spells."

[run_metrics.unhealthy_dwell_p50_s]
unit = "s"
description = "The median length of the run's unhealthy spells."

[run_metrics.unhealthy_dwell_p90_s]
unit = "s"
description = "The p90 length of the run's unhealthy spells."

[run_metrics.onset_after_drop_s]
unit = "s"
description = "Seconds from the first uplink step down to its first unhealthy second, at most the window (the next step, STEP_SECS, or the stream's end)."

[run_metrics.onset_after_drop_censored]
description = "Onset_after_drop_s reached its window's end with no unhealthy second."

[run_metrics.recover_after_rise_s]
unit = "s"
description = "Seconds from the first step up after a step down to a healthy spell of RECOVER_SECS, at most the stream's end."

[run_metrics.recover_after_rise_censored]
description = "Recover_after_rise_s reached the stream's end with no such spell."

[run_metrics.excess_lag_area_ms_s]
unit = "ms x s"
description = "The lag past DELIVERY_TARGET_MS summed over seconds."

[run_metrics.excess_lag_peak_ms]
unit = "ms"
description = "The largest second's lag past DELIVERY_TARGET_MS."

[run_metrics.osc_amp_ms]
unit = "ms"
description = "Half the p10-p90 spread of the lag after the startup."

[run_metrics.osc_period_s]
unit = "s"
description = "The period of the lag's autocorrelation's highest peak past OSC_ACF at OSC_MIN_PERIOD or more, when one is."

[run_metrics.osc_acf]
description = "That peak's autocorrelation."

[run_metrics.lag_p99_startup_ms]
unit = "ms"
description = "The p99 of the honest viewers' lag over their seconds of startup, the run's and their own joins' (`phase_lags`)."

[run_metrics.lag_p99_steady_ms]
unit = "ms"
description = "The p99 of the honest viewers' lag over their seconds of steady state (`phase_lags`)."

[lake.viewer_phases]
macro = "viewer_phases_of"
description = "Each run's viewers' seconds by phase: every span of a viewer's seconds in one of the vocabulary's phases, the tail after the verdict's last second."
restated = ["coalesce\\(\\s*[a-z_]+\\.phase\\s*,\\s*'steady'\\s*\\)"]

[lake.viewer_lag]
macro = "viewer_lag_of"
unit = "ms"
description = "The honest viewers' lag each second, carried from a viewer's last second with a read +1000 ms a second without one, as analyze.py's lags() does."

[lake.playback]
macro = "playback_of"
unit = "ms"
description = "The viewers' playout stalls of the runs at a playout delay, played over their reads as the sims' stalls tables are."

[lake.dynamics_phases]
macro = "dynamics_phases"
unit = "ms"
description = "An experiment's lag by phase, by cell and arm: the honest viewers' seconds of each phase and their lag's p50, p90, p99 and max."

[lake.lag_since]
macro = "lag_since"
unit = "ms"
description = "An experiment's lag against the seconds since each phase window's anchor (phase_windows), by cell, arm, kind and phase."

[lake.effects]
macro = "effects_of"
description = "Each metric's paired effect of one arm against another in each cell: the geometric mean ratio or the mean difference over the seeds paired, with its 95 % t-interval."

[lake.fisher]
macro = "fisher_p"
description = "The two-sided Fisher exact p of two counts out of two totals, as collapse_test_of judges collapsed runs."

[lake.coverage_runs]
macro = "coverage_runs_of"
description = "Each run's seed coverage frame: its streams, chunk interval, end and the arrivals and parents rows it has."

[lake.seed_children]
macro = "seed_children_of"
description = "The seed's push children over the runs, from parents."

[lake.coverage_chunks]
macro = "coverage_chunks_of"
description = "Each chunk the runs published, with its first holds by the seed's children and others, from arrivals and parents."

[lake.seed_cover]
macro = "seed_cover_of"
description = "The runs' seed coverage: how soon a non-seed host first held each chunk the seed published."

[dimensions.sim]
description = "The sim a job ran: strims-sim (the real stack) or the ppspp sim."
values = ["strims-sim", "ppspp"]
column = "jobs.sim"

[dimensions.cell]
description = "A suite cell: one named setting of a sim's test and env (suite.TIERS' cells)."
column = "experiment_jobs.cell"

[dimensions.arm]
description = "An experiment's arm: the commit and env one side of its comparison ran."
column = "experiment_jobs.arm_label"

[dimensions.seed]
description = "A job's seed: the runs of one cell and arm at different seeds are its samples, paired by seed across arms."
column = "jobs.seed"

[dimensions.commit]
description = "The commit a job's binary was built from."
column = "jobs.commit"

[dimensions.tier]
description = "The suite tiers an experiment's cells came from (suite.TIERS)."
column = "experiments.tiers"

[dimensions.phase]
description = "A viewer's second's phase: its startup (the run's or its own join's), steady state, after an event, or the run's tail."
values = "vocab:phases"
macro = "viewer_phases_of"

[dimensions.run_phase]
description = "A run's phase windows: each event's window of seconds and the phase it holds them in."
values = "vocab:phases"
column = "phase_windows.phase"

[dimensions.episode]
description = "A run's spells by the verdict: healthy, unhealthy and collapse."
values = "vocab:episodes"
column = "episodes.kind"

[dimensions.reason]
description = "Why a node's push parent of a stream changed."
values = "vocab:reasons"
column = "parents.reason"

[dimensions.event_kind]
description = "A timed event's kind, as the vocabulary gives each."
values = "vocab:kinds"
column = "events.kind"

[dimensions.role]
description = "The hosts a per-role field covers: the `{role}` part of its name (fields.toml's params)."
values = "fields:role"

[dimensions.honest]
description = "Whether a host is honest (not hostile): the experience metrics count honest viewers."
values = [true, false]
column = "viewers.hostile"

[dimensions.collapsed]
description = "Whether a run collapsed, by the verdict: an unhealthy spell lasting past its startup."
values = [true, false]
column = "verdicts.collapsed"

[dimensions.delay_ms]
description = "A playout delay: DELAYS_MS, the delivery target (1250 ms) and max (4250 ms)."
values = [1250, 4250]
column = "stalls.delay_ms"

[dimensions.stream]
description = "One of a swarm's streams, from 0 below series_meta.json's `streams`."
column = "parents.stream"
