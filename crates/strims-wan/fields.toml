type = "int"
description = "STREAM_REQUESTs declined in samples where the node's upload rate was under half of what it could upload then, over every host (Report::declined)."
notes.strims-sim = "Declines in samples whose upload rate was under half of what the node could upload then, by the meter's rate, every host's; the ppspp sim's `declines_idle` is the share of its declines with the uplink idle."

[rows.declines_idle]
sims = ["ppspp"]
type = "num"
description = "Of the STREAM_REQUESTs the honest viewers declined over the samples, the share declined in a second in which the viewer used under half its uplink (Shape::declines_idle over Shape::declines); left out without declines."
notes.ppspp = "A share of declines; strims-sim's `declined` and `declined_wrongly` are counts, by its meter's rate."

[rows.delivery]
sims = ["strims-sim", "ppspp"]
type = "num"
unit = "fraction"
description = "The share of what the viewers were owed that they read: delivered over written frames of the first swarm, summed over its viewers, each owed every frame the seed wrote while it was there (Report::owed), those written while it was down included; a media swarm's viewer is owed the frames from its first on."
