none = "-1"
params = { who = ["viewer", "seed"], counter = { strims-sim = ["timeouts", "wasted", "answers_refused", "answers_dropped", "switched", "shed", "sheds_sent", "have_bytes", "ack_bytes", "request_bytes", "announce_bytes", "stream_bytes", "session_bytes", "ping_bytes", "header_bytes", "integrity_bytes", "data_bytes", "payloads", "have_only_payloads", "retransmits", "drops", "push_waits", "push_wait_p50_ms", "push_wait_p99_ms", "answer_waits", "answer_wait_p50_ms", "answer_wait_p99_ms", "up_ack_packets", "up_ack_bytes", "up_sack_packets", "up_sack_bytes"], ppspp = ["timeouts", "wasted", "answers_refused", "answers_dropped", "switched", "shed", "sheds_sent", "have_bytes", "ack_bytes", "request_bytes", "announce_bytes", "stream_bytes", "session_bytes", "ping_bytes", "header_bytes", "integrity_bytes", "data_bytes", "payloads", "have_only_payloads", "retransmits", "drops", "push_waits", "push_wait_p50_ms", "push_wait_p99_ms", "answer_waits", "answer_wait_p50_ms", "answer_wait_p99_ms"], decl = ["state_bytes", "spec_sent", "spec_answered", "spec_not_yet", "spec_expired", "spec_cancelled", "requests_not_yet", "parked", "park_released", "park_expired", "park_cancelled", "park_refused", "not_yet_sent", "not_yet_received"], p4tf = ["state_bytes", "spec_sent", "spec_answered", "spec_not_yet", "spec_expired", "spec_cancelled", "requests_not_yet", "parked", "park_released", "park_expired", "park_cancelled", "park_refused", "not_yet_sent", "not_yet_received"] } }
consts.strims-sim = ["who"]
consts.ppspp = ["who"]
code.strims-sim = { counter = ["crate::tables::NODE_COLS", "crate::tables::WAIT_COLS", "crate::tables::ACK_COLS"] }
code.ppspp = { counter = ["crate::NODE_COLS", "crate::WAIT_COLS"] }
description = "A node's counters in the bins beyond the series', as the ppspp sim's tables name them too: requests timed out and chunks wasted, answers a full queue refused (`answers_refused`) and answers dropped at write time (`answers_dropped`, ppspp's `DataDropped`), parents replaced (`switched`), parents lost to their closing the subscription (`shed`) and subscribers closed for a saturated uplink (`sheds_sent`), outbound message bytes by kind, payloads and those of HAVEs alone (from the node's `NODE_BIN_COUNTERS`), then stream messages that lost a packet and packets lost (the network's `UP_COUNTERS`). What a bin's waits give: pushes written and answers sent in it, and the p50 and p99 of their waits (empty without any). The window model's acknowledgements alone through a host's uplink, as `UP_COUNTERS` names them: TCP's pure ACKs and the data channels' SACKs, packets and wire bytes of each. The row's `packets_ack` and `up_acks` count both kinds, over the whole run and every host."
notes.ppspp = "`NodeCounts`' counters: requests timed out, chunks wasted, answers a full queue refused and answers dropped at write time (`strims_ppspp::SwarmCounters`), parents replaced, parents lost to their closing the subscription and subscribers closed for a saturated uplink (`PushStats`' `switched`, `shed`, `sheds_sent`), its outbound messages' bytes by kind, its payloads and those of HAVEs alone (`ChannelMetrics`), and its stream messages that lost a packet and datagrams lost (`Sim::wan_stats`). What a bin's waits give: pushes written and answers sent in it, and the p50 and p99 of their waits (empty without any: `NONE`)."

