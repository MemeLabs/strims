[tables.asks]
sims = ["strims-sim", "ppspp"]
grain = "channel a request of a node's weighed, from its request log (`strims_ppspp::RequestRecord`): every request the request round made, once it ended, the asked peer's row and then one per rival"
keys = "k, node, ask, peer"
joins = "viewers USING (k, src, node); spec_requests USING (k, src, t_ms, node, peer, seq) for round 'spec' AND picked; arrivals ON (k, src) and arrivals.node = asks.peer, seq, arrivals.incarnation = asks.peer_incarnation (the peer's holds, the view's truth)"
knobs = ["SPEC"]
sample = true
zstd = true
normalized = "Every rival kept, in both rounds: a row per request and channel it weighed, the asked row (picked) first; grace_ms, outcome, reason and t_outcome_ms are the asked row's, NULL on a rival's. The sims write what a request was decided on (peer_honest the peer's at the request); the view adds its truth from arrivals, as spec_requests' columns are: held_ms, the peer's first hold of the chunk in its incarnation then (arrivals' earliest row of node = peer, seq, incarnation = peer_incarnation; NULL if none), and from it live (held by since_ms and channel_open_ms, in whole ms), err_ms, pred_err_ms, held_by_p50, held_by_p90 and held_by_p99, and held_by_horizon (held by predicted_horizon_ms, NULL where a log has none), all NULL (live too) for a job whose arrivals the catalog lacks: unknown, not never held. Main's (the HAVE world's request log) has one round, 'flight'; its predicted_ms and predicted_horizon_ms are a rival's route expectation (first sight plus its announcement lag's mean, and plus its horizon), NULL on the asked row, which a HAVE decided, and its predicted_p90_ms and predicted_p99_ms NULL (it predicts no quantiles); timeout_ms, predicted_horizon_ms, have_ms (the row's peer's HAVE of the chunk) and released_ms (push's release of it to pull) are its own; grace_ms, frontier_seq, hole_seq and state_age_ms are NULL there."
description = "Every request a node made and the rival channels its request round weighed: the asked peer's row first, then one per rival, with what each route expected. The HAVE-removal lines' `grace_ms`, `frontier_seq`, `hole_seq` and `state_age_ms` are absent on main (no grace, no STATE summaries); the truth (`held_ms`, `live`, `err_ms`, `pred_err_ms`, `held_by_p50/p90/p99`, `held_by_horizon`) is the catalog's view's, from `arrivals`."
notes.strims-sim = "A node that crashes leaves its requests still open unrecorded."
notes.ppspp = "A node whose place a new viewer takes leaves its requests still open unrecorded."

