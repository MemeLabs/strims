[tables.seed_decisions]
sims = ["strims-sim", "ppspp"]
grain = "decision of the seed's seed log (`strims_ppspp::SeedDecision`)"
keys = "k, node, n"
joins = "viewers ON (k, src) and viewers.node = seed_decisions.peer (the neighbour; none for one that isn't a viewer); parents ON (k, src) and parents.node = seed_decisions.peer, stream and parents.t_ms >= seed_decisions.t_ms, the first such row (the child's side of a grant or a close: parents is a history, every change of the child's without the time condition); seed_sends ON (k, src, node, peer, peer_incarnation, seq) and seed_sends.how = 'push' for a cancel's push (at most one), with seed_sends.t_ms = seed_decisions.due_ms for a check's (exactly one): without how, peer_incarnation and due_ms a decision meets an answer of its chunk too, or a push of it written before"
knobs = ["SPEC"]
sample = false
zstd = false
normalized = "The seed's own decisions (its seed log, both sims, SPEC): a row per decision, n its place in the seed's log (k, node, n key it), its kind saying which columns hold it, the rest NULL; peer NULL for a decision about the allocation (window, answer_rate; an older run's -1 reads NULL too). A request row's subscribers are the stream's before the answer, its holders, copies, held and per_holder NULL where no admission read them; a released or closed row's subscribers those left; a window's capacity_bps NULL until measured, its signals (pushed, behind, overloaded, in_use, saturated) a check's alone. A check reads what the holder said of its due push, and the world decides how it said it: its latest STATE on the HAVE-removal lines (frontier_seq, hole_seq, state_age_ms; silent counts the checks its frontier hadn't reached the push), its HAVEs on main (those three NULL; silent counts the checks its HAVEs didn't announce it)."
shared = "seed_log"
description = "The seed's own decisions, in the order it logged them: requests answered or deferred, subscriptions released or closed, holders that joined, left or were barred, its allocation checks, CANCELs, windows and answer rates; a row's kind says which columns hold it."

