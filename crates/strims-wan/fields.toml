[columns.seed_decisions.why]
sims = ["strims-sim", "ppspp"]
type = "text"
description = "a request's rule: seed_holder, seed_no_copy, seed_barred, seed_streams_held, subscribed (the peer asked again), silent, pin, measured or unmeasured; a closed row's reason: a holder's leaving's (silent, unserved, past_copies, idle or closed), silent (the peer went silent), spill, pin, saturated, declined, or channel (its channel closed: no STREAM_CLOSE went); a holder_left's: silent, unserved, past_copies, idle or closed; a bar's: silent or unserved; a cancel's, where the seed's push of the chunk stood: none, queued (dropped at write time) or written; a window's phase: check, first_wave, ramp or ramp_end"

[columns.seed_decisions.granted]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "a request's: accepted, a STREAM_OPEN following, or declined with a STREAM_CLOSE"

[columns.seed_decisions.subscribers]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "the stream's subscribers: a request's before its answer, a released or closed row's left after it"

[columns.seed_decisions.holders]
sims = ["strims-sim", "ppspp"]
type = "int"
none = "empty"
description = "the holders of a copy: a request's as the seed's admission read them (empty where none did: a pin, a peer asking again, a silent one); a holder_joined's after it; a holder_left's left; a window's"

[columns.seed_decisions.copies]
sims = ["strims-sim", "ppspp"]
type = "int"
none = "empty"
description = "the copies in effect: a request's as the seed's admission read them (empty where none did); a holder_joined's, a holder_left's or a window's"

[columns.seed_decisions.held]
sims = ["strims-sim", "ppspp"]
type = "int"
none = "empty"
description = "the streams the peer held: a request's as the seed's admission read them (empty where none did); a check's, the holder's subscriptions"

[columns.seed_decisions.per_holder]
sims = ["strims-sim", "ppspp"]
type = "int"
none = "empty"
description = "the streams a holder may hold: a request's (empty where no admission read it) or a window's; empty before the budget is measured"

[columns.seed_decisions.satellite]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "a holder_joined's or a check's: the peer holds streams spilled from other holders, with no copy of its own"

[columns.seed_decisions.kept]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "a released row's: a holder's cancel of a stream of its copy, which the seed keeps for a near satellite to take while no one else does"

[columns.seed_decisions.rtt_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
description = "the peer's link's smallest round trip over the last one or two windows: a holder_joined's, a holder_left's or a check's"

[columns.seed_decisions.until_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
description = "a bar's: the peer holds no copy until then, in ms as t_ms"

[columns.seed_decisions.bars]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "a bar's: the peer's bars so far, this one included"

[columns.seed_decisions.reporters]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "a bar's: the reporters that voted on the peer at the latest check"

[columns.seed_decisions.due_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
description = "a check's: when the due push was written, the first written to the holder in the interval before last, in ms as t_ms"

[columns.seed_decisions.judged]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "a check's: the due push was written at least ANNOUNCE_TIMEOUT before, so this check judged it"

[columns.seed_decisions.frontier_seq]
sims = ["strims-sim", "ppspp"]
type = "int"
none = "empty"
description = "a check's, where peers send STATE summaries: the holder's latest STATE's newest chunk of the due push's stream; empty without one, or where peers send HAVEs"

[columns.seed_decisions.hole_seq]
sims = ["strims-sim", "ppspp"]
type = "int"
none = "empty"
description = "a check's: that STATE's newest chunk before its frontier the holder lacked; empty without one"

[columns.seed_decisions.state_age_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
none = "empty"
description = "a check's: that STATE's age at the check; empty without one"

[columns.seed_decisions.silent]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "a check's: the checks in a row at which the holder didn't say it holds its due push (its HAVEs didn't announce it, or its latest STATE's frontier hadn't reached it), after this one; a bar comes at SILENT_CHECKS"

[columns.seed_decisions.queue_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
description = "a check's: how far the holder's link's least round trip since the last check stood above its smallest, the queue below the runner its pushes waited behind"

[columns.seed_decisions.delivered_bps]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "bytes/s"
description = "a check's: the least delivery rate the holder's link read since the last check, in bytes per second"

[columns.seed_decisions.wait_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
description = "a check's: the shortest wait in the seed's queue of a push written to the holder or cancelled by it since the last check"

[columns.seed_decisions.stale]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "a check's: a push to the holder went stale since the last check"

[columns.seed_decisions.budget]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "a window's: the budget in stream slots"

[columns.seed_decisions.measured]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "a window's: the budget is measured"

[columns.seed_decisions.capacity_bps]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "bytes/s"
none = "empty"
description = "a window's: the capacity reading the budget was measured from, in bytes per second; empty until measured"

[columns.seed_decisions.pushed]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "a window's at a check: the holders with a push written or gone stale since the last check"

[columns.seed_decisions.behind]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "a window's at a check: those of them behind, a push waiting past PUSH_WAIT_TARGET or gone stale"

[columns.seed_decisions.overloaded]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "a window's at a check: those of them overloaded, a push waiting past PUSH_WAIT_OVERLOAD or gone stale"

[columns.seed_decisions.in_use]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "a window's at a check: the holders of a copy with a subscription"

[columns.seed_decisions.saturated]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "a window's at a check: the uplink was busy at least SHED_UTILIZATION of the time"

[columns.seed_decisions.unconstrained]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "a window's: the budget has room for every neighbour's every stream"

[columns.seed_decisions.rate_bps]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "bytes/s"
description = "an answer_rate's: the pace of the node's hybrid answers, in bytes per second"

[columns.seed_decisions.reading_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
none = "empty"
description = "an answer_rate's: the node's queueing delay below the runner the answer gate read; empty without a reading"

[columns.seed_decisions.engaged]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "an answer_rate's: the pace binds the answers"

# Retired: columns older runs' seed logs hold, which no sim writes now.

[columns.seed_decisions.delivered]
sims = []
retired = ["strims-sim", "ppspp"]
replaced_by = "delivered_bps"
type = "int"
unit = "bytes/s"
description = "a check's: the least delivery rate the holder's link read since the last check, in bytes per second"

[columns.seed_decisions.capacity]
sims = []
retired = ["strims-sim", "ppspp"]
replaced_by = "capacity_bps"
type = "int"
unit = "bytes/s"
none = "0"
description = "a window's: the capacity reading the budget was measured from, in bytes per second; 0 until measured"

[columns.seed_decisions.rate]
sims = []
retired = ["strims-sim", "ppspp"]
replaced_by = "rate_bps"
type = "int"
unit = "bytes/s"
description = "an answer_rate's: the pace of the node's hybrid answers, in bytes per second"

[tables.seed_sends]
sims = ["strims-sim", "ppspp"]
grain = "chunk the seed pushed or answered, once its send ended, from its seed log (`strims_ppspp::SeedSend`)"
keys = "k, node, n"
joins = "viewers ON (k, src) and viewers.node = seed_sends.peer (the neighbour); arrivals ON (k, src) and arrivals.node = seed_sends.peer, seq, arrivals.incarnation = seed_sends.peer_incarnation (the holder's hold, the view's held_ms: the push's delivery, at most one); seed_decisions ON (k, src, node, peer, peer_incarnation, seq) and seed_decisions.kind = 'cancel' for the CANCELs of its chunk, not one to one (a peer cancels a chunk more than once, and a CANCEL of several chunks is logged at its first): the one at seed_decisions.t_ms = seed_sends.cancel_ms is the first that named the chunk alone, none for a range's"
knobs = ["SPEC"]
sample = false
zstd = false
normalized = "Every chunk the seed pushed or answered, once its send ended (its seed log, both sims, SPEC): n is its place in the seed's log (k, node, n key it), peer the neighbour (an older run's -1, a neighbour gone before the log's take, reads NULL), t_ms the end (written to the frame, or dropped), queued_ms the push's queueing or the answered request's arrival; bytes NULL unless written; cancel_ms NULL without the peer's CANCEL of the chunk by the end. fate 'suppressed' is main's alone (the peer's HAVEs announced the chunk). declared reads what the peer said of the chunk as the world has it said: its latest STATE covering it on the HAVE-removal lines (by its frontier, after its hole), its HAVEs on main (asks' declares, the requester's side, reads the same). The sims write the send (seed_sends_log); the view adds held_ms, the peer's first hold of the chunk in its incarnation then (arrivals' earliest row of node = peer, seq, incarnation = peer_incarnation), a written push's delivery where it comes after queued_ms; NULL where the peer never held the chunk in that incarnation (written is the seed's side: the peer left with the push in flight, or never held the chunk), and NULL for a job whose arrivals the catalog lacks: unknown, not never held."
shared = "seed_log"
description = "Every chunk the seed pushed or answered, once its send ended: how, to whom, its fate and its bytes."

[columns.seed_sends.t_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
description = "when the send ended, written to the frame or dropped, in ms of true time from the stream's start, as the sim's other tables count it"

[columns.seed_sends.node]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "the seed: its host in strims-sim, its node in the ppspp sim"

[columns.seed_sends.n]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "the send's place in the seed's log, from 0, in the order the seed's sends ended; with node it keys the table"

[columns.seed_sends.peer]
sims = ["strims-sim", "ppspp"]
type = "int"
none = "empty"
older_none = "-1"
description = "the neighbour sent to, numbered as node is; empty if the sim can't name it"

[columns.seed_sends.peer_incarnation]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "the neighbour's incarnation when the chunk was queued, as the sim's arrivals count them"

[columns.seed_sends.how]
sims = ["strims-sim", "ppspp"]
type = "text"
description = "push, to a subscriber of the chunk's stream, or answer, to the peer's request"

[columns.seed_sends.stream]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "the chunk's stream"

[columns.seed_sends.seq]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "the chunk"

[columns.seed_sends.queued_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
description = "when the push was queued, or the answered request came (a released park's: its release), in ms as t_ms"

[columns.seed_sends.fate]
sims = ["strims-sim", "ppspp"]
type = "text"
description = "written, to the peer's frame; stale, a push dropped at write time for waiting past PUSH_STALE; cancelled, a push dropped at write time, the peer having cancelled the chunk; suppressed, a push dropped at write time, the peer's HAVEs having announced the chunk (where peers send HAVEs); refused, the peer's queue was full; dropped, unwritable at write time (its data gone, data-less, or too large for an empty frame); closed, a push still queued when the peer's channel closed"

[columns.seed_sends.bytes]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "bytes"
none = "empty"
description = "the frame bytes written for the chunk, integrity included (an answer of several chunks: its share); empty unless written"

[columns.seed_sends.cancel_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
none = "empty"
description = "the peer's first CANCEL of the chunk, if it came by the end, in ms as t_ms; empty without one"

[columns.seed_sends.declared]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "at the end, the peer said it holds the chunk: its HAVEs announced it, or, where peers send STATE summaries, its latest STATE covered it (at or after its oldest chunk, by its frontier, after its hole)"

[columns.seed_sends.subscribed]
sims = ["strims-sim", "ppspp"]
type = "bool"
description = "at the end, the peer was subscribed to the chunk's stream"
