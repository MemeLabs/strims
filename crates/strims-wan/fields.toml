#:schema vocab.schema.json
# The sims' recorded names: every field of a run's row, key of its
# series_meta.json and column of its tables that either sim writes (the
# real stack's crates/strims-sim and the ppspp sim,
# crates/strims-ppspp/tests/sim.rs), and every name a line writes before
# main does. hack/simlab/vocab.py makes each sim's module of its names
# from it (crates/strims-sim/src/fields.rs,
# crates/strims-ppspp/tests/sim/fields.rs), through which the sims write
# them: a name a sim writes that isn't here for it doesn't compile, and one
# here it doesn't write is dead code. hack/simlab/spec.py checks it
# (`python3 hack/simlab/vocab.py check`) and writes its schema,
# vocab.schema.json.
#
# [rows.<id>], [meta.<id>] (series_meta.json's keys) and
# [columns.<table>.<id>] each declare a name, or a family of names: an id
# with {param} parts, its names those of every value of its params.
#   sims          the sims that write it: strims-sim, ppspp; [] for one
#                 only a line writes
#   writers       the lab's programs that add it to a sim's row, no sim
#                 writing it: suite (hack/simlab/suite.py's local runs);
#                 its name starts with an underscore, a sim's never does
#   lines         the lines that write it and main doesn't: decl (the
#                 HAVE removal's declared-summary line, seed-cover), p4tf
#                 (its park4 line, seed-cover-p4tf); a family's values a
#                 line adds to main's are keyed by the line in its params
#   retired       the sims whose older runs hold it, where no sim writes it
#                 now (sims = []): a name whose meaning changes takes a new
#                 one, and the old stays, retired, so older runs still read
#   replaced_by   a retired name's replacement, a name of its section the
#                 sims it replaces it for write now: one, or a table by
#                 sim; left out where no name took its place
#   rename        the replacement means the same: the catalog's rows view
#                 (and scalars) read a retired row field's values under its
#                 replacement's name for the sims it's replaced for, raw.rows
#                 keeping what was written, and farm.py's reports read either
#                 (vocab.resolve, vocab.aliases)
#   type          int, num, text, bool, ints (a list of integers), nums (a
#                 list of numbers), json (another JSON value)
#   unit          ms, us, s, bytes, fraction, ...
#   none          how a sim writes "none" where it isn't left out: empty
#                 (an empty field), -1, 0, negative (a time before the
#                 start), null (a row's JSON null); the catalog's views read
#                 -1 and a negative time as none (NULL)
#   older_none    -1 where older runs wrote none so, which the views read
#                 as none too
#   params        a family's {param = values}: a list, or a table of lists
#                 by sim (and line); a list of such tables is their union
#   code.<sim>    {param = [Rust expressions]}: the code's arrays a param's
#                 values are, concatenated, which a generated test holds
#                 equal
#   description   what it holds
#   notes.<sim>   that sim's own doc of it, where it says more or other
#
# [tables.<name>]: a table either sim writes. sims and lines as above,
# grain (a row per what), keys and joins (the catalog's), knobs (the
# settings that write it, less their sim's prefix, STRIMS_SIM_ or SIM_),
# sample (a sample table: store_host.SAMPLE_TABLES), zstd (written as
# <name>.csv.zst), normalized (what the catalog's view changes), none (-1:
# every numeric column but the ids writes none as -1, declared or not),
# shared (its columns are a shared formatter's), description, notes.<sim>.
# The catalog's registries of the tables (its keys, joins and
# normalization, query.TABLE_KNOBS) are these.

[rows."{role}_ack_{why}"]
sims = ["strims-sim"]
type = "int"
params = { role = ["seed", "viewer"], why = ["now", "quick", "read", "timer", "data"] }
code.strims-sim = { why = ["crate::ACK_WHYS"] }
description = "With the window model, the acknowledgements the seed's TCP receivers sent, of what its viewers sent it, and the honest viewers' (summed), of what reached them, by why (`crate::ACK_WHYS`: `seed_ack_now`, `viewer_ack_timer`, ...), pure ones and those data carried alike; and the mean and p90 of the delayed ones' waits (`*_delack_mean_ms`, `*_delack_p90_ms`, to the millisecond below), from the first byte owed to the timer's send."

[rows."{role}_delack_mean_ms"]
sims = ["strims-sim"]
type = "num"
unit = "ms"
params = { role = ["seed", "viewer"] }
description = "With the window model, the acknowledgements the seed's TCP receivers sent, of what its viewers sent it, and the honest viewers' (summed), of what reached them, by why (`crate::ACK_WHYS`: `seed_ack_now`, `viewer_ack_timer`, ...), pure ones and those data carried alike; and the mean and p90 of the delayed ones' waits (`*_delack_mean_ms`, `*_delack_p90_ms`, to the millisecond below), from the first byte owed to the timer's send."

[rows."{role}_delack_p90_ms"]
sims = ["strims-sim"]
type = "int"
unit = "ms"
params = { role = ["seed", "viewer"] }
description = "With the window model, the acknowledgements the seed's TCP receivers sent, of what its viewers sent it, and the honest viewers' (summed), of what reached them, by why (`crate::ACK_WHYS`: `seed_ack_now`, `viewer_ack_timer`, ...), pure ones and those data carried alike; and the mean and p90 of the delayed ones' waits (`*_delack_mean_ms`, `*_delack_p90_ms`, to the millisecond below), from the first byte owed to the timer's send."

[rows."{reading}_err_{role}_ms"]
sims = ["strims-sim"]
type = "num"
unit = "ms"
params = { reading = ["qd", "qdv", "qdb", "qdbi", "qdl"], role = ["seeds", "accepting", "delivering"] }
description = "The row's `<reading>_err_<role>_ms`, `<reading>_fp_<role>` and `<reading>_fn_<role>` score the meter's delay (`qd`), vnic's path excess (`qdv`) and queued time (`qdb`) against the standing queue, and the queued time (`qdbi`) and the latest round trips' excess (`qdl`) against the wait at the moment."

[rows."{reading}_fn_{role}"]
sims = ["strims-sim"]
type = "num"
params = { reading = ["qd", "qdv", "qdb", "qdbi", "qdl"], role = ["seeds", "accepting", "delivering"] }
description = "In WAN mode, the share of the truth's positives that reading `reading` read negative, over the meter samples of role `role` (`seeds`, the swarms' seeds; `accepting` and `delivering`, the first swarm's honest viewers of each population, `meter_{pop}_p{p}`'s) while a swarm streams (Report::queue_delay_accuracy), the readings and thresholds as `{reading}_fp_{role}`'s. Left out without samples."

[rows."{reading}_fp_{role}"]
sims = ["strims-sim"]
type = "num"
params = { reading = ["qd", "qdv", "qdb", "qdbi", "qdl"], role = ["seeds", "accepting", "delivering"] }
description = "In WAN mode, the share of the truth's negatives that reading `reading` read positive, over the meter samples of role `role` (`seeds`, the swarms' seeds; `accepting` and `delivering`, the first swarm's honest viewers of each population, `meter_{pop}_p{p}`'s) while a swarm streams (Report::queue_delay_accuracy): `qd`, `qdv` and `qdb` (the meter's delay, vnic's path excess and queued time) against the standing queue, `qdbi` and `qdl` (the queued time, the latest round trips' excess) against the wait at the moment; positive from QUEUE_DELAY_THRESHOLD_MS, the truth from SATURATED_STANDING_MS. Left out without samples."

[rows."{window}_p{p}"]
sims = ["strims-sim", "ppspp"]
type = "num"
params = [{ window = ["cwnd_kib"], p = ["10", "50", "90"] }, { window = ["flight_kib", "flight_kib_busy", "reqs_out", "reqs_out_busy", "ledbat_qd_ms", "cto_ms"], p = ["50", "90"] }]
description = "Most samples of a push channel have nothing out, so the flight and the requests out also read over the samples with any (`*_busy_*`), with the share of samples with requests out (`reqs_out_share`)."

[rows."{event}_p{p}_ms"]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
params = { event = ["join", "caught_up"], p = ["50", "90"] }
consts.strims-sim = ["p"]
consts.ppspp = ["p"]
description = "over every join (`Report::joins`), the ms to its first frame (`join_p50_ms`, `join_p90_ms`; `join_unread`, the joins that read nothing) and to catching up (`caught_up_p50_ms`, `caught_up_p90_ms`; `caught_up_never`);"
notes.ppspp = "The columns of a run with arrivals or departures (`Sim::audience`, `AudienceReport`): the knobs; the viewers that arrived after the start and that left for good (`_honest` of them); over every honest viewer, from its join (its arrival, the start for one there from it) to its first read (`join_p50_ms`, `join_p90_ms`; `join_unread`, those that never read) and to its first read within `CAUGHT_UP` (`caught_up_p50_ms`, `caught_up_p90_ms`; `caught_up_never`); the honest viewers whose open parent left (`parent_lost`, counted per departure) and their streams it was the parent of; and with departures the recovery from them (`Recovery`): the viewers measured (`depart_stayed`) and those left without a neighbour at the end (`depart_stranded`), their worst lag (`depart_lag_peak_ms`), and by their per-second lag p90 its excess summed (`depart_excess_lag_area_ms_s`) and the time back under `CAUGHT_U..."

[rows._rss_mb]
sims = []
writers = ["suite"]
type = "int"
unit = "MB"
description = "The job's peak resident memory in MiB, as suite.py's local run measured it (its process's maxrss, or /usr/bin/time's where it timed the run): the host's number, not the sim's. The fold keeps it as the run's rss_mb (job_runs), not as a column of rows."

[rows._wall_s]
sims = []
writers = ["suite"]
type = "num"
unit = "s"
description = "The job's wall-clock seconds, as suite.py's local run timed it, to the hundredth: the host's number, not the sim's. The fold keeps it as the run's wall_s (job_runs), not as a column of rows."

[rows.access]
sims = ["ppspp"]
type = "text"
description = "In WAN mode, the access link of the config's first site (the seed's); `-` outside WAN mode."

[rows.announce_bps]
sims = ["ppspp"]
type = "num"
unit = "bytes/s"
description = "The bytes of the ANNOUNCEs with entries that reached the seed per second of the stream (over stream_secs)."

[rows.announce_bytes]
sims = ["ppspp"]
type = "int"
unit = "bytes"
description = "The bytes of the ANNOUNCEs with entries that reached the seed."

[rows.announce_share]
sims = ["ppspp"]
type = "num"
unit = "fraction"
description = "The bytes of the ANNOUNCEs with entries that reached the seed, as a share of what the viewers sent."

[rows.announces]
sims = ["ppspp"]
type = "int"
description = "ANNOUNCEs with entries that reached the seed."

[rows.arrivals]
sims = ["strims-sim", "ppspp"]
type = "text"
description = "The run's arrivals profile, its knob's text (STRIMS_SIM_ARRIVALS, SIM_ARRIVALS); left out for one with every viewer from the start (strims-sim) or without arrivals or departures (the ppspp sim)."

[rows.arrived]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "`arrived`, `arrived_honest`: the viewers that arrived after the run's start (`HostSpec::arrive_at`), and of them the honest; `departed`, `departed_honest`, those that left for good;"

[rows.arrived_honest]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "`arrived`, `arrived_honest`: the viewers that arrived after the run's start (`HostSpec::arrive_at`), and of them the honest; `departed`, `departed_honest`, those that left for good;"

[rows.asks]
sims = ["ppspp"]
type = "int"
description = "The ANNOUNCE messages the seed sent, over all its channels in the swarm, at the end (the channels' outbound announce counters). Not the asks table's requests."

[rows.barred]
sims = ["ppspp"]
type = "int"
description = "The neighbours an adaptive seed barred from holding a copy."

[rows.barred_honest]
sims = ["ppspp"]
type = "int"
description = "Of the neighbours an adaptive seed barred, the honest ones."

[rows.bucket_p50_ms]
sims = ["strims-sim"]
type = "ints"
unit = "ms"
description = "Per BUCKET (30 s) of the first swarm's stream time from its start, the median lag in ms of the frames its viewers read (Report::lag_buckets)."

[rows.bucket_p99_ms]
sims = ["strims-sim"]
type = "ints"
unit = "ms"
description = "Per BUCKET (30 s) of the first swarm's stream time from its start, the p99 lag in ms of the frames its viewers read (Report::lag_buckets)."

[rows.busy_seeds_p50]
sims = ["strims-sim"]
type = "num"
description = "The median busy fraction of the seeds' meters over their samples while a swarm streams (Report::busy_median)."

[rows.bytes]
sims = ["ppspp"]
type = "int"
unit = "bytes"
description = "The bytes of the frames with ppspp data every node sent over the run."

[rows.cap_depth_rho]
sims = ["strims-sim"]
type = "num"
description = "`cap_depth_rho`: Spearman's rank correlation of the uplink with the mean push-tree depth (a stream's hops to the seed), and `cap_depth_rho_startup` over the first `BUCKET`: negative while strong uplinks sit near the seed;"

[rows.cap_depth_rho_startup]
sims = ["strims-sim"]
type = "num"
description = "`cap_depth_rho`: Spearman's rank correlation of the uplink with the mean push-tree depth (a stream's hops to the seed), and `cap_depth_rho_startup` over the first `BUCKET`: negative while strong uplinks sit near the seed;"

[rows.cap_fanout_rho]
sims = ["strims-sim"]
type = "num"
description = "`cap_fanout_rho`: with the mean children;"

[rows.cap_hops_rho]
sims = ["strims-sim"]
type = "num"
description = "`cap_hops_rho`: with the mean hops to the seed in the link graph (through hosts other than infrastructure);"

[rows.case]
sims = ["ppspp"]
type = "text"
description = "The allocation the job ran: for cable-seed, its seed policy's allocation (SIM_SEED_POLICY: adaptive or admission); for an AbScenario, its AllocCase (SIM_CASE, AdaptiveQos by default)."

[rows.caught_up_never]
sims = ["strims-sim", "ppspp"]
type = "int"
description = "over every join (`Report::joins`), the ms to its first frame (`join_p50_ms`, `join_p90_ms`; `join_unread`, the joins that read nothing) and to catching up (`caught_up_p50_ms`, `caught_up_p90_ms`; `caught_up_never`);"
notes.ppspp = "The columns of a run with arrivals or departures (`Sim::audience`, `AudienceReport`): the knobs; the viewers that arrived after the start and that left for good (`_honest` of them); over every honest viewer, from its join (its arrival, the start for one there from it) to its first read (`join_p50_ms`, `join_p90_ms`; `join_unread`, those that never read) and to its first read within `CAUGHT_UP` (`caught_up_p50_ms`, `caught_up_p90_ms`; `caught_up_never`); the honest viewers whose open parent left (`parent_lost`, counted per departure) and their streams it was the parent of; and with departures the recovery from them (`Recovery`): the viewers measured (`depart_stayed`) and those left without a neighbour at the end (`depart_stranded`), their worst lag (`depart_lag_peak_ms`), and by their per-second lag p90 its excess summed (`depart_excess_lag_area_ms_s`) and the time back under `CAUGHT_U..."

[rows.chunk]
sims = ["ppspp"]
type = "int"
description = "The stream's chunk size, in bytes."

[rows.chunks_read]
sims = ["ppspp"]
type = "int"
description = "The chunks the honest viewers read, summed: those watching at the run's end and those that left for good."
notes.ppspp = "strims-sim's row writes no counterpart."

[rows.churn_leaves]
sims = ["ppspp"]
type = "int"
description = "With churn (SIM_CHURN), the churn's leaves done by the run's end."

[rows."clock_{class}"]
sims = ["strims-sim", "ppspp"]
type = "int"
none = "empty"
params = { class = ["lt_100ms", "lt_2s", "lt_15s", "le_10min"] }
code.strims-sim = { class = ["crate::skew::SkewClass::ALL.map(crate::skew::SkewClass::name)"] }
code.ppspp = { class = ["crate::CLOCK_CLASSES"] }
description = "With clock skew, the hosts (nodes) whose clock offset is of class `class`: under 100 ms, 2 s or 15 s, or up to 10 min (SkewClass)."

[rows."clock_{class}_delivery"]
sims = ["ppspp"]
type = "num"
params = { class = ["lt_100ms", "lt_2s", "lt_15s", "le_10min"] }
code.ppspp = { class = ["crate::CLOCK_CLASSES"] }
description = "With clock skew, the share of the stream's chunks the honest viewers of clock class `class` read, of those due them (Sim::delivered, with arrivals or departures)."

[rows."clock_{class}_lag_p99_ms"]
sims = ["ppspp"]
type = "int"
unit = "ms"
params = { class = ["lt_100ms", "lt_2s", "lt_15s", "le_10min"] }
code.ppspp = { class = ["crate::CLOCK_CLASSES"] }
description = "With clock skew, the lag p99 in ms of the honest viewers of clock class `class` after their warm-ups."

[rows."clock_{class}_viewers"]
sims = ["ppspp"]
type = "int"
params = { class = ["lt_100ms", "lt_2s", "lt_15s", "le_10min"] }
code.ppspp = { class = ["crate::CLOCK_CLASSES"] }
description = "With clock skew, the honest viewers of clock class `class` whose places were never taken again; left out for a class without any."

[rows.clock_max_ms]
sims = ["strims-sim", "ppspp"]
type = "int"
unit = "ms"
none = "empty"
description = "With clock skew, the largest clock offset's magnitude, in ms."

[rows.clock_offsets_ms]
sims = ["strims-sim", "ppspp"]
type = "ints"
unit = "ms"
none = "empty"
description = "With clock skew, every host's (node's) clock offset in signed ms, by host index."

[rows.clock_skew]
sims = ["strims-sim", "ppspp"]
type = "text"
none = "empty"
description = "The clock skew the run's clocks had (STRIMS_SIM_CLOCK_SKEW, SIM_CLOCK_SKEW): its knob's text."

[rows.collude]
sims = ["ppspp"]
type = "int"
