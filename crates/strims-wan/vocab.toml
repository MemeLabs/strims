# The sims' event vocabulary: every kind of event an `events` table holds
# (both sims', and the verdict's `derived_events`), the verdict's phases
# and episodes, and the `parents` table's reasons. Rust embeds it and names
# its kinds (src/vocab.rs), simlab reads it (hack/simlab/vocab.py), and the
# console takes its lists (src/devtools/components/console/vocab.ts).
# `python3 hack/simlab/vocab.py write` makes the generated files from it;
# `check` fails while they differ.
#
# An id is immutable. A kind whose meaning changes takes a new id, and the
# old one stays, retired, with `replaced_by` (the new id, or a table of
# them by sim) and the meaning it had. No id is reused.
#
# [kinds.<id>]
#   class        scenario: exogenous, what the scenario does to the run;
#                observation: the run's response; decision: a node's
#                scheduler decisions, from its event log; derived: the
#                verdict's own, made from the series (`derived_events`)
#   sims         the sims here that write it: strims-sim, ppspp (a retired
#                kind's, those that wrote it). Empty for a kind only other
#                builds' runs hold; none for a derived kind
#   with         the knob a sim writes it under (SIM_X, strims-sim's
#                STRIMS_SIM_X)
#   description  what happened
#   node, peer   what those columns hold, -1 for none
#   value, unit  what `value` holds, and in what
#   detail       what `detail` holds; details, its values
#   notes.<sim>  that sim's kind, where it differs from the rest
#   replaced_by  a retired kind's current id, or a table of them by sim
# and a kind that anchors a phase:
#   phase        the phase it opens: a name, or {down, up} by its value's
#                direction, with level = true
#   until        the kind that ends its span
#   scope        run or viewer: whose phase it sets
#   horizon_s    how long the phase lasts after it, or after its span
#
# [phases.<name>], [episodes.<name>], [reasons.<name>]
#   description  what it is
#   colour       its colour in the console's charts, #rrggbb, one to a name
#                of its section

# --- scenario ---------------------------------------------------------------

[kinds.partition]
class = "scenario"
sims = ["strims-sim"]
description = "Everything between two groups of hosts is dropped (`Fault::Partition`): TCP streams that lose a segment stall until their read timeout."
node = "the first group's first host"
peer = "the second group's first host"
value = "the groups' sizes' product"

[kinds.repair]
class = "scenario"
sims = ["strims-sim"]
description = "The partition between two groups of hosts ends (`Fault::Repair`)."
node = "the first group's first host"
peer = "the second group's first host"
value = "the groups' sizes' product"

[kinds.hold]
class = "scenario"
sims = ["strims-sim"]
description = "Everything between two groups of hosts is held, and delivered on release (`Fault::Hold`). In WAN mode, messages still cross the path and the receiver's downlink meanwhile, and wait there."
node = "the first group's first host"
peer = "the second group's first host"
value = "the groups' sizes' product"

[kinds.release]
class = "scenario"
sims = ["strims-sim"]
description = "What a hold between two groups of hosts held is delivered (`Fault::Release`)."
node = "the first group's first host"
peer = "the second group's first host"
value = "the groups' sizes' product"

[kinds.crash]
class = "scenario"
sims = ["strims-sim"]
description = "The host's software is killed, after partitioning it from every other host (`Fault::Crash`). The FINs of the sockets the crash drops are lost, as in a power loss; peers notice by timeouts, or by an RST once the host answers again."
node = "the host"

[kinds.restart]
class = "scenario"
sims = ["strims-sim"]
description = "The host's software starts again (`Fault::Restart`): a new node with the same profile key and a new host key, every partition between the host and the others repaired first."
node = "the host"

[kinds.latency]
class = "scenario"
sims = ["strims-sim", "ppspp"]
description = "A fixed one-way latency from then on."
value = "the one-way latency"
unit = "ms"

[kinds.latency.notes]
strims-sim = "Between two groups of hosts (`Fault::Latency`), `node` and `peer` the groups' first hosts. In WAN mode it replaces the paths' base latency, and jitter, loss and bandwidth still apply."
ppspp = "A seed step (`SeedStep::Latency`): every link to and from the seed, `node` the seed and `peer` -1."

[kinds.pause_reading]
class = "scenario"
sims = ["strims-sim"]
description = "The host's swarm readers stop reading (`Fault::PauseReading`)."
node = "the host"

[kinds.resume_reading]
class = "scenario"
sims = ["strims-sim"]
description = "The host's swarm readers read again (`Fault::ResumeReading`)."
node = "the host"

[kinds.reset_writer]
class = "scenario"
sims = ["strims-sim"]
description = "A swarm's seed starts a new epoch (`Fault::ResetWriter`, `SwarmWriter::reset`)."
node = "the swarm's number, not a host"

[kinds.uplink]
class = "scenario"
sims = ["strims-sim", "ppspp"]
description = "A host's upload limit from then on: a cap on its software in strims-sim, the seed's link in the ppspp sim."
node = "the host"
value = "the limit"
unit = "bytes/s"

[kinds.uplink.notes]
strims-sim = "A new upload cap for the host (`Fault::Uplink`, `Node::set_rate_limit`), applied within 100 ms. Its site's own rate steps are `up_step`'s."
ppspp = "A seed step (`SeedStep::Uplink`): the seed's uplink becomes `value`; `node` the seed."

[kinds.connect]
class = "scenario"
sims = ["strims-sim"]
description = "A host links to another through peer exchange (`Fault::Connect`, `Node::connect_peer`), within 100 ms. With WebRTC on both sides and no listeners, the link is a direct WebRTC link."
node = "the host that links"
peer = "the host it links to"
value = "the network's number"

[kinds.depart]
class = "scenario"
sims = ["strims-sim", "ppspp"]
description = "A viewer leaves for good."
node = "the viewer"
detail = "how it left"
details = ["graceful", "abrupt"]

[kinds.depart.notes]
strims-sim = "`Fault::Depart`; `value` 1 for an abrupt departure, 0 for a graceful one. An abrupt departure is a crash that leaves the host cut off and stopped, and counts no restart."
ppspp = "`Depart`; `value` 0. Gracefully, its neighbours see its links close and drop them, and each viewer among them asks for another at once (`relink`); abruptly, it goes silent, and its neighbours' links to it close at their read timeouts."

[kinds.up_step]
class = "scenario"
sims = ["strims-sim"]
description = "The upload available on a host's site uplink from then on, in WAN mode (`HostSpec::up_steps`), as when other traffic takes part of it for a while."
node = "the host"
value = "the upload available"
unit = "bytes/s"

[kinds.competing_start]
class = "scenario"
sims = ["strims-sim"]
description = "Bulk uploads by other software on the host start, sharing its uplink with the node's traffic (`HostSpec::competing`: WAN mode, with the window model)."
node = "the host"
value = "the competing flow's round trip"
unit = "ms"

[kinds.competing_stop]
class = "scenario"
sims = ["strims-sim"]
description = "The host's competing upload stops (`HostSpec::competing`)."
node = "the host"

[kinds.arrive]
class = "scenario"
sims = ["strims-sim"]
description = "A host that comes after the run's start boots (`HostSpec::arrive_at`): its node starts, joins its swarms and dials its links."
node = "the host"

[kinds.join]
class = "scenario"
sims = ["strims-sim", "ppspp"]
description = "A viewer incarnation starts reading the stream."
node = "the viewer"

[kinds.join.notes]
strims-sim = "Each viewer incarnation's (`Join`'s start), a restart's too."
ppspp = "Each viewer's, at the start or its arrival, and on taking a place again (`Churn`)."

[kinds.leave]
class = "scenario"
sims = ["ppspp"]
description = "A viewer leaves mid-stream (`Churn`): its neighbours see its links close, as a closed tab's, and a new viewer with nothing takes its place on the same links a while later (its `join`)."
node = "the viewer"

[kinds.reconnect]
class = "scenario"
sims = ["ppspp"]
description = "The seed's channels close and open again on both ends, as after a dropped and redialed link (`SeedStep::Reconnect`)."
node = "the seed"

[kinds.incident]
class = "scenario"
sims = ["ppspp"]
description = "Something happens to the busiest relay, the honest peer that uploaded the most so far, mid-stream (`Incident`): it disappears without a word, or its uplink drops."
node = "the relay"
value = "its new uplink, 0 when it dies"
unit = "bytes/s"
detail = "what happened"
details = ["dies", "slows"]

# --- observation ------------------------------------------------------------

[kinds.first_frame]
class = "observation"
sims = ["strims-sim"]
description = "A viewer incarnation's first frame arrived (`Join`)."
node = "the viewer"
value = "the time since its join"
unit = "ms"

[kinds.first_read]
class = "observation"
sims = ["ppspp"]
description = "A viewer incarnation read its first chunk."
node = "the viewer"
value = "the time since its join"
unit = "ms"

[kinds.caught_up]
class = "observation"
sims = ["strims-sim", "ppspp"]
description = "A viewer incarnation's first read within delivery's share of the 2 s glass-to-glass target of its publishing (strims-sim's `CAUGHT_UP_MS`, the ppspp sim's `CAUGHT_UP`)."
node = "the viewer"
value = "the time since its join"
unit = "ms"

[kinds.caught_up.notes]
strims-sim = "Its first frame read that fresh (`Join`)."
ppspp = "Its first chunk read that fresh."

[kinds.parent_lost]
class = "observation"
sims = ["strims-sim", "ppspp"]
description = "A viewer's push parent departed (`depart`). The scheduler's own event of a parent's channel closing is another kind, `parent_channel_closed`."
node = "the viewer"
peer = "the parent that departed"

[kinds.parent_lost.notes]
strims-sim = "`Report::parent_losses`: a host that departed while it was a push parent of one of the viewer's streams of the first swarm, at the viewer's last stats sample before. Timed when the viewer stopped counting on it (its link to it closed, or a stats sample named it parent of no stream), or at the departure if it never did; `value` the ms from the departure until then, -1 if it never did; `detail` empty."
ppspp = "Timed at the departure, one for each neighbour whose open parent it was on some stream; `value` the streams it was the parent of; `detail` the departure's, graceful or abrupt."

[kinds.relink]
class = "observation"
sims = ["ppspp"]
description = "A viewer that lost a neighbour to a departure links to another (`Sim::relink`), as a client keeping its peers asks its tracker again once a link closes."
node = "the viewer"
peer = "the node it links to"

[kinds.copies]
class = "observation"
sims = ["strims-sim"]
description = "The seed's copies, at each change of its seed sample: its budget, window, copies or first wave, so `value` can repeat."
node = "the seed"
value = "its copies"

[kinds.parent_channel_closed]
class = "observation"
sims = []
with = "SIM_SPEC"
description = "The scheduler's own event: the child's channel with its parent of a stream closed, whatever the cause (the parent departing or closing it, a read timeout, or the child's own close). Timed at the close, one for each stream."
node = "the child"
peer = "the parent"
value = "the stream"

# --- decision ---------------------------------------------------------------
# A node's scheduler event log (`strims_ppspp::SchedEventKind`'s name, value
# and detail).

[kinds.parent_choice]
class = "decision"
sims = []
with = "SIM_SPEC"
description = "A parent check asked the peer to push a stream (STREAM_REQUEST)."
node = "the node"
peer = "the peer asked"
value = "the stream"
detail = "`switch` when the stream had an open parent the peer would replace, else `open`"
details = ["open", "switch"]

[kinds.parent_open]
class = "decision"
sims = []
with = "SIM_SPEC"
description = "The peer opened a stream that had no open parent."
node = "the node"
peer = "the parent"
value = "the stream"

[kinds.parent_switch]
class = "decision"
sims = []
with = "SIM_SPEC"
description = "The peer opened a stream in place of its open parent."
node = "the node"
peer = "the new parent"
value = "the stream"

[kinds.prune]
class = "decision"
sims = []
with = "SIM_SPEC"
description = "The node cancelled the peer as a stream's parent for its misses."
node = "the node"
peer = "the parent"
value = "the stream"
detail = "the rule that pruned it"
details = ["silent", "lossy", "silent_lossy"]

[kinds.shed_by]
class = "decision"
sims = []
with = "SIM_SPEC"
description = "The peer, the node's parent of a stream, closed it (STREAM_CLOSE)."
node = "the node"
peer = "the parent"
value = "the stream"

[kinds.window_collapse]
class = "decision"
sims = []
with = "SIM_SPEC"
description = "The request window to the peer fell to its minimum (`ledbat::MIN_WINDOW`), by a congestion timeout or by the delay signal."
node = "the node"
peer = "the peer"
value = "the window before"
unit = "bytes"
detail = "`cto` for a congestion timeout, `delay` for the delay signal"
details = ["cto", "delay"]

[kinds.timeout_loss]
class = "decision"
sims = []
with = "SIM_SPEC"
description = "Requests to the peer timed out, and the request window went from one size to another, halved at most once a round trip."
node = "the node"
peer = "the peer"
value = "the requests that timed out"
detail = "`halved` if the window fell"
details = ["halved"]

[kinds.read_skip]
class = "decision"
sims = []
with = "SIM_SPEC"
description = "A low latency reader that waited on the first chunk missing after its first read position moved on to its newest stored run (`FIRST_GAP_WAIT`)."
node = "the node"
value = "the chunks passed over"
detail = "`from=<chunk> to=<chunk> wait_ms=<ms>`"

# --- derived ----------------------------------------------------------------
# The verdict's events of a run (`verdict.events`), at a second of its
# series.

[kinds.start]
class = "derived"
description = "The stream's start."

[kinds.seed_down]
class = "derived"
description = "The seed's uplink stepped down."
value = "the new uplink over the old"

[kinds.seed_up]
class = "derived"
description = "The seed's uplink stepped up."
value = "the new uplink over the old"

[kinds.present_join]
class = "derived"
description = "The viewers present rose."
value = "by how many"

[kinds.present_leave]
class = "derived"
description = "The viewers present fell."
value = "by how many"

[kinds.onset]
class = "derived"
description = "The verdict's onset."

[kinds.recovered]
class = "derived"
description = "The verdict's recovery."

[kinds.collapse]
class = "derived"
description = "A collapse spell began."
value = "its length"
unit = "s"

# --- phases -----------------------------------------------------------------
# What each second of a run is (`verdict.phases`). Colours: the console's
# categorical hues (theme.ts' SERIES) at steps over 3:1 on light and dark
# surfaces, none yellow, which would read as the episodes' unhealthy beside
# them; steady, every other second, is the de-emphasis grey.

[phases.startup]
description = "The run's startup: its first `STARTUP_SECS` seconds, none when every viewer arrived later."
colour = "#2a78d6"

[phases.after_down]
description = "Within `STEP_SECS` of the seed's latest uplink step, a step down."
colour = "#eb6834"

[phases.after_up]
description = "Within `STEP_SECS` of the seed's latest uplink step, a step up."
colour = "#199e70"

[phases.steady]
description = "Every other second of the verdict's."
colour = "#c3c2b7"

[phases.tail]
description = "A second past the verdict's: the run's tail, after the stream's seconds (`query.pooled` by phase)."
colour = "#9085e9"

# --- episodes ---------------------------------------------------------------
# A run's spells (`verdict.episodes`). Colours: the status scale (theme.ts'
# STATUS), good, warning and critical.

[episodes.healthy]
description = "A run of healthy seconds: no trigger (trees, delivery or latency) held."
colour = "#0ca30c"

[episodes.unhealthy]
description = "A run of unhealthy seconds: a trigger held in each."
colour = "#fab219"

[episodes.collapse]
description = "An unhealthy run of `COLLAPSED_SECS` seconds or more that lasts past the run's startup (`verdict.collapsed`'s rule), listed again as a collapse."
colour = "#d03b3b"

# --- reasons ----------------------------------------------------------------
# Why a node's push parent of a stream changed: the `parents` table's
# `reason` (`strims_ppspp::ParentWhy`). Colours: the console's first five
# categorical hues in order, at the steps that keep every pair apart (a
# second's stack holds any of them).

[reasons.open]
description = "A STREAM_OPEN gave a stream without a parent one."
colour = "#2a78d6"

[reasons.switch]
description = "A STREAM_OPEN replaced the open parent (graft before prune)."
colour = "#d95926"

[reasons.lost]
description = "No one ended the subscription: the channel to the parent closed, or a new stream started (a reset). The sims' `parents` count the node's own stop too: strims-sim's crash or abrupt departure, the ppspp sim's node that left, departed or died."
colour = "#199e70"

[reasons.prune]
description = "The node cancelled the parent: for its misses, for an OPEN past its window, or at the driver's word (`Runner::cancel_stream`)."
colour = "#eda100"

[reasons.shed]
description = "The parent closed the subscription (STREAM_CLOSE)."
colour = "#e87ba4"
