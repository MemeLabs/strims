[package]
name = "strims-proto"
description = "Generated protobuf types for schema/"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build/main.rs"

[features]
# RPC service interfaces (`service` and the generated per-service items).
# Off in core crates; the app layer turns it on through `strims-rpc`.
services = ["dep:futures-core"]

[dependencies]
prost.workspace = true
futures-core = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true
prost-types.workspace = true
protox.workspace = true
# same major as prost-build's own identifier conversion (see build/stable.rs)
heck = "0.5"

[dev-dependencies]
hex.workspace = true

[[test]]
name = "service"
required-features = ["services"]

[lints]
workspace = true
