syntax = "proto3";

package strims.vpn.v1;

option go_package = "github.com/MemeLabs/strims/pkg/apis/vpn/v1;vpnv1";
option java_package = "gg.strims.vpn.v1";
option swift_prefix = "SVN";

message PeerIndexMessage {
  // What a record states. Unpublish marks a record that withdraws the
  // host's earlier ones for the hash.
  message RecordBody {
    bytes hash = 1;
    bytes host_id = 2;
    uint32 port = 3;
    int64 timestamp = 4;
    bool unpublish = 5;
  }

  // A RecordBody's encoding, signed by its host in the
  // vpn-peer-index-record domain.
  message Record {
    bytes body = 1;
    bytes signature = 2;
  }

  message Publish {
    Record record = 1;
  }

  message Unpublish {
    Record record = 1;
  }

  message SearchRequest {
    uint64 request_id = 1;
    bytes hash = 2;
  }

  message SearchResponse {
    uint64 request_id = 1;
    repeated Record records = 2;
  }

  oneof body {
    Publish publish = 1;
    Unpublish unpublish = 2;
    SearchRequest search_request = 3;
    SearchResponse search_response = 4;
  }
}
