[workspace]
resolver = "3"
members = [
  "crates/strims-base",
  "crates/strims-binmap",
  "crates/strims-chunkstream",
  "crates/strims-proto",
  "crates/strims-crypto",
  "crates/strims-qos",
  "crates/strims-kademlia",
  "crates/strims-mpc",
  "crates/strims-ppspp",
  "crates/strims-ppspp-capture",
  "crates/strims-vnic",
  "crates/strims-vpn",
  "crates/strims-webrtc",
  "crates/strims-rpc",
  "crates/strims-kv",
  "crates/strims-kv-redb",
  "crates/strims-dao",
  "crates/strims-replication",
  "crates/strims-transfer",
  "crates/strims-network",
  "crates/strims-directory",
  "crates/strims-chat",
  "crates/strims-video",
  "crates/strims-debug",
  "crates/strims-session",
  "crates/strims-testworld",
  "crates/strims-golden",
  "crates/strims-wan",
  "crates/strims-node-core",
  "crates/strims-node",
  "crates/strims-sim",
  "crates/strims-testbed",
  "crates/strims-svc",
  "crates/strims-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/MemeLabs/strims"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
# determinism guardrails, configured in clippy.toml
disallowed_methods = "deny"
disallowed_types = "deny"
# peer input must never panic the node
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"

[workspace.dependencies]
# internal
strims-base = { path = "crates/strims-base" }
strims-binmap = { path = "crates/strims-binmap" }
strims-chunkstream = { path = "crates/strims-chunkstream" }
strims-proto = { path = "crates/strims-proto" }
strims-crypto = { path = "crates/strims-crypto" }
strims-qos = { path = "crates/strims-qos" }
strims-kademlia = { path = "crates/strims-kademlia" }
strims-mpc = { path = "crates/strims-mpc" }
strims-ppspp = { path = "crates/strims-ppspp" }
strims-ppspp-capture = { path = "crates/strims-ppspp-capture" }
strims-vnic = { path = "crates/strims-vnic" }
strims-vpn = { path = "crates/strims-vpn" }
strims-webrtc = { path = "crates/strims-webrtc" }
strims-rpc = { path = "crates/strims-rpc" }
strims-kv = { path = "crates/strims-kv" }
strims-kv-redb = { path = "crates/strims-kv-redb" }
strims-dao = { path = "crates/strims-dao" }
strims-replication = { path = "crates/strims-replication" }
strims-transfer = { path = "crates/strims-transfer" }
strims-network = { path = "crates/strims-network" }
strims-directory = { path = "crates/strims-directory" }
strims-chat = { path = "crates/strims-chat" }
strims-video = { path = "crates/strims-video" }
strims-debug = { path = "crates/strims-debug" }
strims-session = { path = "crates/strims-session" }
strims-testworld = { path = "crates/strims-testworld" }
strims-golden = { path = "crates/strims-golden" }
strims-wan = { path = "crates/strims-wan" }
strims-node-core = { path = "crates/strims-node-core" }
strims-node = { path = "crates/strims-node" }
strims-sim = { path = "crates/strims-sim" }
strims-testbed = { path = "crates/strims-testbed" }
strims-svc = { path = "crates/strims-svc" }
strims-wasm = { path = "crates/strims-wasm" }

# general
thiserror = "2"
tracing = "0.1"
bytes = "1"
smallvec = "1"
slotmap = "1"
indexmap = "2"
hex = "0.4"
data-encoding = "2"

# text matching: explicit caches and capped lazy DFAs, no OS dependencies
regex = "1.13"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "perf", "unicode-case", "meta", "nfa-pikevm", "nfa-backtrack", "hybrid"] }

# randomness: never thread_rng / OsRng in core crates (see crates/CONVENTIONS.md)
rand_core = "0.10"
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.10", default-features = false }

# async (app layer and drivers; never in core crates)
futures-core = { version = "0.3", default-features = false }
futures-sink = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }

# heap counters, the binaries' global allocators
cap = { version = "0.1.2", features = ["stats"] }
stats_alloc = "0.1.10"

# JSON, for the directory's embed APIs
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# protobuf
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
protox = "0.10"

# crypto
ed25519-dalek = "3"
x25519-dalek = "3"
curve25519-dalek = "5"
aes = "0.9"
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }  # default features pull getrandom, which breaks wasm32
cfb-mode = "0.9"
blake2 = "0.11"
blake3 = "1"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
sha3 = "0.12"
md-5 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }

# drivers and simulation (never in core crates)
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
turmoil = "0.7"
tokio-tungstenite = "0.30"
# HTTP/1 heads: strims-svc's HLS requests, strims-node's HTTPS responses
httparse = "1.10"
# TLS on the ring provider, for native HTTPS clients
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
str0m = "0.24"

# storage (native drivers only)
redb = "4.4"

# testing
proptest = "1"

# Optimize dependencies (not workspace crates) in dev builds. Unoptimized
# ed25519 costs about 7.5 ms per verified vpn message, which dominates debug
# simulation runtimes.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
# The name section is over half the module; without it, wasm frames in
# stack traces show as function indices.
strip = true
